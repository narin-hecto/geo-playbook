\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Publish your pricing<\u002Fh3>\n        <p style=\"font-size: 17.5px; line-height: 1.62; color: #3E4658; margin-bottom: 14px;\">\"Price, cost, and buy\" queries trigger AI Overviews more than <strong>80%<\u002Fstrong> of the time, and most local businesses avoid publishing pricing out of competitive anxiety. Heitzman's counter: give realistic ranges and explain the variables that move the price, because a business that won't answer the cost question hands that citation to a competitor who will.<\u002Fp>\n        <div style=\"background: #22314D; border-radius: 5px; padding: 30px 34px; margin-bottom: 20px;\">\n          <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.82); margin-bottom: 12px;\"><strong style=\"color:#fff;\">Kevin Indig<\u002Fstrong> makes the sharper version: when an AI system searches on a user's behalf, it tries to establish pricing even when the user never asked, because price is a fact it needs to complete its own evaluation.<\u002Fp>\n          <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.82);\">Withhold it and you get one of two worse outcomes: the AI drops you from the answer, or it pulls a figure from a third-party aggregator that may be outdated or wrong. Withholding pricing to filter leads is a defensible call. Assuming it stops an AI from guessing is not.<\u002Fp>\n        <\u002Fdiv>\n        <h3 style=\"font-weight: 800; font-size: 24px; color: #22314D; margin-bottom: 12px;\">Reviews are now an AI-visibility task<\u002Fh3>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: #3E4658;\">A review saying \"the technician arrived on time and fixed our water heater in an hour\" teaches an AI system something specific about services, speed, and outcome. A bare five-star rating teaches it nothing. Four things drive the signal: <strong>frequency<\u002Fstrong> of new reviews, <strong>specificity<\u002Fstrong> of language, whether the business <strong>responds<\u002Fstrong>, and general <strong>profile activity<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #22314D; border-radius: 5px; padding: 44px 50px; margin-bottom: 40px;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px;\">\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #fff;\">The Google Business Profile maintenance cadence<\u002Fh3>\n        <span style=\"font-weight: 700; font-size: 12px; letter-spacing: .14em; color: #FE6901;\">NO LONGER SET-AND-FORGET<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;\">\n        <sc-for list=\"{{ gbp }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"border-top: 2px solid rgba(254,105,1,.4); padding-top: 16px;\">\n            <div style=\"font-weight: 800; font-size: 13px; letter-spacing: .1em; color: #FE6901; margin-bottom: 10px;\">{{ g.when }}<\u002Fdiv>\n            <div style=\"font-weight: 700; font-size: 18px; color: #fff; margin-bottom: 8px;\">{{ g.title }}<\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.52; color: rgba(255,255,255,.72);\">{{ g.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.66); margin-top: 26px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 20px;\">Whitespark's 2026 Local Search Ranking Factors report introduced an <strong style=\"color:#fff;\">AI Search Visibility category<\u002Fstrong> for the first time, with three of the top five factors being citation and entity-based. Search Atlas (3,269 businesses) found proximity drives ~55% of ranking decisions across positions 1–21 — but in the top 10 it drops to 36%, while review count rises to 26% and review-keyword relevance to 22%. Proximity you can't change. Review volume and service-specific language inside those reviews you can.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 26px; color: #22314D; margin-bottom: 8px;\">Five ways to build citation authority beyond your own pages<\u002Fh3>\n        <p style=\"font-size: 16px; color: #545C6E; margin-bottom: 18px;\">Owned content is only ~23% of branded-query citations. These five plays go after the other 77%.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ citationPlays }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 20px 24px; display: flex; gap: 16px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 22px; color: #FE6901; min-width: 26px;\">{{ p.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-weight: 700; font-size: 16.5px; color: #22314D; margin-bottom: 3px;\">{{ p.title }}<\u002Fdiv>\n                <p style=\"font-size: 15.5px; line-height: 1.45; color: #545C6E;\">{{ p.desc }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 36px; margin-bottom: 20px;\">\n          <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 6px;\">A 20-MINUTE AUDIT BEFORE AN ENGAGEMENT STARTS<\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.5; color: #545C6E; margin-bottom: 14px;\">GatherUp's four-step version (Annie Jackson &amp; Jason Wortham), fast enough to run in a first client call.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n            <sc-for list=\"{{ quickAudit }}\" as=\"q\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n                <span style=\"font-weight: 800; font-size: 14px; color: #FE6901; min-width: 20px;\">{{ q.n }}<\u002Fspan>\n                <span style=\"font-size: 15.5px; line-height: 1.45; color: #3E4658;\"><strong style=\"color:#22314D;\">{{ q.title }}<\u002Fstrong> — {{ q.desc }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: #545C6E; margin-top: 14px;\">Whatever it turns up falls into three buckets: accurate but <strong>thin<\u002Fstrong> (build first-party content), accurate but <strong>not surfacing<\u002Fstrong> (manage — engage reviews, surface proof points), or actively <strong>working against you<\u002Fstrong> (defend — flag and dispute policy-violating fake reviews with evidence).<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #22314D; border-radius: 5px; padding: 28px 34px;\">\n          <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 10px;\">OFF-PAGE AUTHORITY, BY CADENCE<\u002Fdiv>\n          <sc-for list=\"{{ offpageCadence }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom: 16px;\">\n              <div style=\"font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 8px;\">{{ g.tag }}<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n                <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                    <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #FE6901; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n                    <span style=\"font-size: 15px; line-height: 1.42; color: rgba(255,255,255,.74);\">{{ i }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 5 ============ -->\n  <section data-screen-label=\"Part 5 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">5<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART FIVE<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">PR &amp; Brand Authority<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">Shaping what AI systems say about you.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 5\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <p style=\"font-size: 20px; line-height: 1.6; color: #3E4658; max-width: 1000px; margin-bottom: 40px;\">Parts 3 and 4 fix what's <em>true<\u002Fem>. This part makes sure AI systems — and the people reading their answers — understand it correctly.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ prCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 30px; display: flex; flex-direction: column;\">\n          <div style=\"font-weight: 800; font-size: 30px; color: #FE6901; margin-bottom: 14px;\">{{ c.n }}<\u002Fdiv>\n          <h3 style=\"font-weight: 700; font-size: 21px; color: #22314D; line-height: 1.18; margin-bottom: 12px; text-wrap: pretty;\">{{ c.title }}<\u002Fh3>\n          <p style=\"font-size: 16.5px; line-height: 1.55; color: #4A5265;\">{{ c.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top: 34px; background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 30px 40px;\">\n      <p style=\"font-size: 18.5px; line-height: 1.55; color: #22314D;\"><strong>The thread through everything:<\u002Fstrong> the only way to influence what an LLM says is a clear, consistently reinforced brand identity. Start with one checkable answer to <em>\"what do you want people to say about your brand?\"<\u002Fem> — then reinforce it in every page, every outreach effort, and every placement. Run the sentiment audit <strong>branded and unbranded<\u002Fstrong>: asking only \"is [Brand] any good?\" overstates how you show up to a customer who never thought to type your name.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 6 ============ -->\n  <section data-screen-label=\"Part 6 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">6<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART SIX<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Paid Media in the AI Era<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 780px;\">How ad platforms are rebuilding around AI Mode and agentic commerce.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 6\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">The platforms are already rebuilding around this<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\">Google's own Marketing Live 2026 recap, with a foreword from <strong>Vidhya Srinivasan<\u002Fstrong> (VP/GM, Ads and Commerce), frames it directly: \"AI is the best thing that has ever happened to Google Search,\" and the company describes rebuilding its ad products so that <strong>\"the best ads are just answers.\"<\u002Fstrong><\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\">Concretely: AI Max for Search and Performance Max are being positioned to place ads inside AI Mode conversations; AI-powered Shopping ads surface a curated product list against long conversational queries; and Gemini-built \"agentic ads\" handle back-and-forth qualification inside a chat interface. A \"Universal Commerce Protocol\" is intended to let live inventory, loyalty, and checkout data flow directly into an AI conversation.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 38px 42px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 20px;\">NAMED THIRD-PARTY MEASUREMENT<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <sc-for list=\"{{ paidStats }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 18px; align-items: baseline; border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 18px;\">\n              <span style=\"font-weight: 800; font-size: 32px; color: #FE6901; min-width: 92px;\">{{ p.stat }}<\u002Fspan>\n              <div>\n                <div style=\"font-size: 16px; line-height: 1.45; color: rgba(255,255,255,.82);\">{{ p.label }}<\u002Fdiv>\n                <div style=\"font-weight: 700; font-size: 12px; letter-spacing: .06em; color: rgba(255,255,255,.45); margin-top: 5px;\">{{ p.src }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.5); margin-top: 16px; font-style: italic;\">Figures attributed only to \"Google Internal Data\" are the company's own reported numbers, not independently verified — worth knowing before repeating them.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 34px;\">\n      <sc-for list=\"{{ paidCases }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 30px;\">\n          <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .1em; color: #FE6901; margin-bottom: 12px;\">{{ c.brand }}<\u002Fdiv>\n          <div style=\"font-weight: 800; font-size: 30px; color: #22314D; margin-bottom: 10px;\">{{ c.result }}<\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.5; color: #545C6E;\">{{ c.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 32px 40px;\">\n      <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">WHAT THIS CHANGES FOR HOW WE BRIEF PAID STRATEGY<\u002Fdiv>\n      <p style=\"font-size: 18px; line-height: 1.58; color: #22314D;\">None of this replaces account fundamentals. It changes two things. <strong>First:<\u002Fstrong> first-party data feeding a campaign (margin, loyalty, real customer profiles) is a bigger lever than manual bid and keyword management, because that's what the platforms' own optimization is built to use. <strong>Second:<\u002Fstrong> creative and audience signal quality matter <em>more<\u002Fem>, not less — campaign types built for this era hand more of the targeting decision to the platform's model, leaving creative and data as the main levers an advertiser still directly controls.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 7 ============ -->\n  <section data-screen-label=\"Part 7 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">7<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART SEVEN<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Measurement<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What actually tells you it's working.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 7 - Conversion questions\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <h3 style=\"font-weight: 800; font-size: 30px; color: #22314D; margin-bottom: 10px;\">Three new conversion questions to replace the old ones<\u002Fh3>\n    <p style=\"font-size: 17.5px; line-height: 1.6; color: #545C6E; max-width: 1000px; margin-bottom: 30px;\">Once a meaningful share of research happens inside an AI conversation instead of a results page, \"conversion\" needs a new definition. Three questions replace the click-through-and-convert model — each maps back to a part of this book.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 48px;\">\n      <sc-for list=\"{{ conversionQs }}\" as=\"q\" hint-placeholder-count=\"3\">\n        <div style=\"background: #22314D; border-radius: 5px; padding: 34px 32px; display: flex; flex-direction: column;\">\n          <div style=\"font-weight: 800; font-size: 30px; color: #FE6901; margin-bottom: 14px;\">{{ q.n }}<\u002Fdiv>\n          <h4 style=\"font-weight: 700; font-size: 20px; line-height: 1.22; color: #fff; margin-bottom: 12px; text-wrap: pretty;\">{{ q.q }}<\u002Fh4>\n          <p style=\"font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.74); margin-bottom: 14px;\">{{ q.body }}<\u002Fp>\n          <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .06em; color: #FE6901; margin-top: auto;\">{{ q.practical }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">The old dashboard is going dark<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\">Mentions, share of voice, and citations don't live in the tools most teams have open daily. Alex Moss calls attribution \"a mess\" — even Google says it has no plans to add AI Overview insight data to Search Console. In the SC generative report, an impression only counts when a collapsed \"show more\" link is actually opened, and there's no click data at all (John Mueller, via Nicola Agius).<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>The working proxy:<\u002Fstrong> branded search volume tracked over time. Similarweb found <strong>55.9%<\u002Fstrong> of downstream traffic after a ChatGPT recommendation arrived via branded search, not a direct click.<\u002Fp>\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 26px 30px;\">\n          <p style=\"font-style: italic; font-size: 17.5px; line-height: 1.5; color: #22314D;\">\"Our current attribution models have a blind spot: AI-influenced demand often arrives through Search and Direct, not through AI referrals.\"<\u002Fp>\n          <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .06em; color: #FE6901; margin-top: 10px;\">ALEYDA SOLÍS<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; font-size: 15px; letter-spacing: .1em; color: #FE6901; margin-bottom: 16px;\">THE MONITORING CADENCE<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ cadence }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 16px; align-items: center; background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 14px 20px;\">\n              <span style=\"font-weight: 800; font-size: 12px; letter-spacing: .08em; color: #fff; background: #FE6901; padding: 5px 11px; border-radius: 30px; min-width: 88px; text-align: center;\">{{ c.when }}<\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.4; color: #3E4658;\">{{ c.what }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 7 - Rigor\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Why a single AI-visibility number is close to meaningless<\u002Fh3>\n        <p style=\"font-size: 17.5px; line-height: 1.62; color: #3E4658; margin-bottom: 14px;\"><strong>Ben Moore<\u002Fstrong> (Discovered Labs): RAG answers are stochastic, not deterministic. The same prompt asked twice can retrieve different sources and produce a different answer — GPU batching and kernel scheduling introduce numerical variation that cascades through a probabilistic output, and temperature sampling adds deliberate randomness on top. Measuring visibility with one prompt run once is measuring a moment of noise.<\u002Fp>\n        <p style=\"font-size: 17.5px; line-height: 1.62; color: #3E4658; margin-bottom: 14px;\">His fix borrows from clinical trials rather than classical significance testing: report a <strong>credible interval<\u002Fstrong> instead of a point estimate, and use a <strong>Bayes factor<\u002Fstrong> to judge whether a week-over-week change is real or within the range noise alone produces. A score moving 22% → 26% might be a gain. Without an interval attached, there's no way to tell.<\u002Fp>\n        <p style=\"font-size: 17.5px; line-height: 1.62; color: #3E4658;\"><strong>Cadence:<\u002Fstrong> weekly snapshots, each treated as one data point in a trend rather than a verdict, with enough prompt volume per snapshot that an interval can be calculated rather than asserted.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 38px 42px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 20px;\">THREE CHECKS BEFORE TRUSTING ANY PROMPT SET<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <sc-for list=\"{{ moorechecks }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 18px;\">\n              <div style=\"font-weight: 700; font-size: 17px; color: #fff; margin-bottom: 5px;\">{{ m.name }}<\u002Fdiv>\n              <p style=\"font-size: 15.5px; line-height: 1.5; color: rgba(255,255,255,.72);\">{{ m.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start;\">\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">THE DOWNSTREAM IMPACT OF AI VISIBILITY (SIMILARWEB)<\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.58; color: #3E4658; margin-bottom: 16px;\">Similarweb's research team tracked real user journeys across finance, travel, and beauty for the seven days after a user asked ChatGPT a category question and got a brand recommendation — excluding anyone who'd visited that brand recently or named it in their own prompt.<\u002Fp>\n        <div style=\"display: flex; gap: 30px; align-items: flex-start; margin-bottom: 16px;\">\n          <div><div style=\"font-weight: 800; font-size: 46px; color: #FE6901; line-height: 1;\">2.5×<\u002Fdiv><p style=\"font-size: 15px; line-height: 1.45; color: #545C6E; margin-top: 8px; max-width: 220px;\">more likely to visit the AI-recommended brand's site within 7 days than a named competitor's — and the effect flipped when the competitor got the recommendation.<\u002Fp><\u002Fdiv>\n          <div style=\"flex: 1;\">\n            <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .08em; color: #22314D; margin-bottom: 10px;\">WHICH TOOL USERS FOUND MORE USEFUL<\u002Fdiv>\n            <sc-for list=\"{{ funnelStages }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #EBE6DB;\">\n                <span style=\"font-size: 15px; color: #3E4658;\">{{ f.stage }}<\u002Fspan>\n                <span style=\"font-size: 15px; font-weight: 700; color: #22314D;\">{{ f.split }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"font-size: 14px; line-height: 1.45; color: #6A7284; margin-top: 10px;\">AI tools shape the <em>start<\u002Fem> of research more than the end — which is why a referral metric measured at the point of purchase understates their influence.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">GOOGLE'S OWN TOOLS ARE STILL INCOMPLETE<\u002Fdiv>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.8); margin-bottom: 14px;\">Merchant Center's \"AI performance insights\" pilot shows how products appear across Google's AI shopping features — but coverage is uneven and it doesn't yet provide click or conversion attribution (Matt G. Southern, SEJ; Brodie Clark had early access).<\u002Fp>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.8); margin-bottom: 14px;\">The UK's <strong style=\"color:#fff;\">Competition and Markets Authority<\u002Fstrong> has since required impressions, clicks, and CTR for generative AI features to be reported separately from general search, giving Google nine months to implement. As of that reporting, the click data hadn't appeared in either dashboard.<\u002Fp>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.8);\"><strong style=\"color:#fff;\">The practical read:<\u002Fstrong> neither the platform tools nor the regulation around them are settled. Build on trackable proxies now — branded search, share of voice, downstream-traffic research — rather than waiting for Google's reporting to catch up.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 8 ============ -->\n  <section data-screen-label=\"Part 8 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">8<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART EIGHT<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Governance<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 720px;\">The AI-crawler decision sitting underneath all of it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 8\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">The deal that built the web is breaking<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>Matthew Prince<\u002Fstrong> (Cloudflare, July 2025) frames the economic shift: the old bargain let Google index a site in exchange for traffic the site could monetize. The interface changed. He cites research that ~75% of mobile Google queries are now answered without leaving Google.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\">Cloudflare's response, launched July 1, 2025 as \"Content Independence Day\": default to blocking AI crawlers unless the AI company compensates the creator. His longer-term vision is a marketplace where content is valued not by the traffic it generates but by how much genuinely new information it contributes. Whether AI crawlers can reach a business's content at all is now <strong>a decision, not a default<\u002Fstrong> — and it deserves the same quarterly review as any other technical item.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 38px 40px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 18px;\">HARDER TO EARN A CLICK THAN A DECADE AGO<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ multipliers }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; align-items: baseline; gap: 16px;\">\n              <span style=\"font-weight: 800; font-size: 34px; color: #FE6901; min-width: 130px;\">{{ m.x }}<\u002Fspan>\n              <span style=\"font-size: 16px; color: rgba(255,255,255,.78);\">{{ m.who }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-style: italic; font-size: 13.5px; color: rgba(255,255,255,.5); margin-top: 20px;\">Prince's own estimates, stated as his claim rather than an independently verified figure.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 40px;\">\n      <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 10px;\">WATCH FOR: GOOGLE'S OWN AI OPT-OUT CONTROLS<\u002Fdiv>\n      <p style=\"font-size: 17.5px; line-height: 1.6; color: #3E4658; margin-bottom: 12px;\">Google is reportedly exploring controls that would let a site opt out of AI Overviews and AI Mode summaries specifically, separate from its general robots.txt crawl policy. Details and timing aren't confirmed — treat this as a heads-up, not a feature that exists yet.<\u002Fp>\n      <p style=\"font-size: 17.5px; line-height: 1.6; color: #3E4658;\">If it does roll out, it creates a smaller-scale version of the same decision: does a page or section benefit more from AI Overview inclusion (visibility, authority, brand presence in an answer) or from preserving traditional clicks on high-value commercial queries where an AI summary already satisfies the searcher? Identify which queries are showing AI Overviews and losing CTR, then test opt-out against inclusion on a subset of pages before making it a blanket policy either way.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 9 ============ -->\n  <section data-screen-label=\"Part 9 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">9<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART NINE<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Experiment &amp; Automation<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 780px;\">Specific tests to run — and how sub-agent tooling changes the workload.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 9 - Experiments\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1.15fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 30px; color: #22314D; line-height: 1.1; margin-bottom: 18px;\">Every item here is a hypothesis, not a rule<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\">Parts 2 through 8 are recommendations backed by someone else's research. This part is a working list of testable changes — run each on a subset of pages or locations, against a matched control left unchanged, not everywhere at once.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 40px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 16px;\">DECIDE FOUR THINGS BEFORE STARTING<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n          <sc-for list=\"{{ testRules }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 15px; color: #FE6901;\">{{ t.n }}<\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.45; color: rgba(255,255,255,.82);\">{{ t.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.6); margin-top: 18px;\">A test missing any of these four isn't an experiment. It's a change made on a guess, with results read after the fact to match whatever story is convenient.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ experiments }}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 30px 30px; break-inside: avoid;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #F0EBE0;\">\n            <span style=\"width: 8px; height: 20px; background: #FE6901; border-radius: 2px;\"><\u002Fspan>\n            <h4 style=\"font-weight: 800; font-size: 19px; color: #22314D;\">{{ e.title }}<\u002Fh4>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <sc-for list=\"{{ e.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #22314D; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.45; color: #4A5265;\">{{ i }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 44px; background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 30px 40px;\">\n      <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 10px;\">CONTEXT-PRIMING: A FIVE-MINUTE SETUP WORTH TESTING FIRST<\u002Fdiv>\n      <p style=\"font-size: 17.5px; line-height: 1.58; color: #22314D;\">Before any AI-assisted strategy work, feed the model your own site's actual content instead of letting it reason from general knowledge. Crawl your key product and feature pages with Screaming Frog (scoped with an include filter), export each page's text individually (Bulk Export → Web → Page Text), merge the files into one document, and upload it before starting the conversation. A model given the real page text can reason about specific gaps and redundancies; one without it guesses at what your key pages say and returns generic category advice.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 9 - Automation\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;\">\n      <div>\n        <div style=\"font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">TEN LOOPS FOR TEAMS RUNNING SUB-AGENT TOOLING<\u002Fdiv>\n        <h3 style=\"font-weight: 800; font-size: 38px; color: #22314D; letter-spacing: -.01em;\">Automating the recurring work<\u002Fh3>\n      <\u002Fdiv>\n      <p style=\"font-size: 16.5px; line-height: 1.55; color: #545C6E; max-width: 520px;\">Running several agents in parallel against different slices of the same problem turns a quarterly manual project into an overnight loop. Each maps back to a part of this book.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 24px;\">\n      <sc-for list=\"{{ automation }}\" as=\"a\" hint-placeholder-count=\"10\">\n        <div style=\"display: flex; gap: 18px; align-items: baseline; background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 20px 26px;\">\n          <span style=\"font-weight: 800; font-size: 20px; color: #FE6901; min-width: 30px;\">{{ a.n }}<\u002Fspan>\n          <div style=\"flex: 1;\">\n            <div style=\"font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 3px;\">{{ a.title }}<\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.45; color: #545C6E;\">{{ a.desc }}<\u002Fp>\n          <\u002Fdiv>\n          <span style=\"font-weight: 700; font-size: 11px; letter-spacing: .08em; color: #FE6901; background: #FFF3EA; border: 1px solid #FBD9BE; padding: 4px 10px; border-radius: 30px; flex-shrink: 0;\">{{ a.part }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size: 18px; line-height: 1.6; color: #22314D; margin-top: 30px; border-top: 2px solid #22314D; padding-top: 22px;\"><strong>The throughline:<\u002Fstrong> sub-agent tooling doesn't replace the judgment calls elsewhere in this book — what to prioritize, what a result means, whether a change is worth making. It replaces the manual labor of running the same repeatable check across hundreds of pages, locations, or competitors, which is exactly the work Parts 2, 3, 4, and 7 ask a team to do on a recurring cadence.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ SOURCES ============ -->\n  <section data-screen-label=\"Sources\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px;\">\n      <div>\n        <div style=\"font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">APPENDIX<\u002Fdiv>\n        <h2 style=\"font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">Sources<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px;\">\n      <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"20\">\n        <div style=\"display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid #E4DFD4; align-items: baseline;\">\n          <span style=\"font-weight: 800; font-size: 15px; color: #FE6901; min-width: 26px;\">{{ s.n }}<\u002Fspan>\n          <div>\n            <span style=\"font-size: 15.5px; line-height: 1.45; color: #22314D;\"><strong>{{ s.author }}<\u002Fstrong> — {{ s.title }}<\u002Fspan>\n            <span style=\"font-style: italic; font-size: 14px; color: #6A7284;\"> {{ s.pub }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.55; color: #6A7284; margin-top: 24px; max-width: 1140px;\">Additional individuals quoted or cited at first mention in the body: Aleyda Solís (Orainti), Eli Schwartz, Lily Ray, Pedro Dias, Dan Taylor, Glenn Gabe, Danny Sullivan, John Mueller, Martin Splitt, Shushrita M., Nicola Agius (Reach PLC), Chris Donnelly (Searchable), Kevin Indig, David McSweeney, Dan Petrovic, Jan-Willem Bobbink, Mike King (iPullRank), Steve Toth, Joy Hawkins (Sterling Sky), Mike Blumenthal and Greg Sterling (Near Media), Darren Shaw (Whitespark), Brodie Clark, Slobodan Manic, and Doostmohammadi et al. (2023). Concept credit to Cindy Krum for \"fraggles\" in Part 3.<\u002Fp>\n    <div style=\"margin-top: 40px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid #22314D; padding-top: 24px;\">\n      <div style=\"display: flex; align-items: center; gap: 14px;\">\n        <div style=\"width: 40px; height: 40px; border-radius: 8px; background: #22314D; display: flex; align-items: center; justify-content: center;\"><img src=\"8b0c6dba-b421-4468-8cc8-571f887c03f7\" alt=\"Hecto\" style=\"width: 26px; height: 26px; object-fit: contain;\"><\u002Fdiv>\n        <span style=\"font-weight: 700; letter-spacing: .22em; font-size: 13px; color: #22314D;\">HECTO MARKETING<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-weight: 600; letter-spacing: .16em; font-size: 12px; color: #9AA0AC;\">THE GEO/AEO PLAYBOOK · 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1460}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('geo_playbook_checklist') || '{}'); } catch (e) {}\n    this.state = { data: saved };\n    this._defs = this.checklistDefs();\n  }\n\n  checklistDefs() {\n    return [\n      { title: 'Research & Audit (do this first)', items: [\n        { id: 'r0', text: 'One-sentence statement of the actual business problem this work solves, plus the approach chosen to address it.', hint: 'The challenge is\\u2026' },\n        { id: 'r1', text: 'Baseline check: ask 3\\u20135 named AI platforms who the leading providers are in your category; document who gets named.', hint: 'Platforms + category\\u2026' },\n        { id: 'r2', text: 'Identify third-party sites that mention your top competitors but not you; note as outreach targets.', hint: 'Competitors\\u2026' },\n        { id: 'r3', text: 'Pull the last 90 days of GSC queries; filter for question-based phrasing to find real customer language.', hint: 'Date range / owner\\u2026' },\n        { id: 'r4', text: 'Build a working prompt list customers would type before choosing a provider \\u2014 branded and brand-neutral. Rank by priority.', hint: 'Owner / target count\\u2026' },\n        { id: 'r5', text: 'Run a short 3\\u20135 question customer survey on what they typed when they started looking.', hint: 'Owner\\u2026' } ] },\n      { title: 'On-Page (fix your own site next)', items: [\n        { id: 'o1', text: 'Top pages reviewed for a direct answer in the first 1\\u20132 sentences of each section \\u2014 punchline first, not last.', hint: 'How many pages\\u2026' },\n        { id: 'o2', text: 'TL;DR / key-takeaways block added; question-based headings mirroring real searches.', hint: 'Owner\\u2026' },\n        { id: 'o3', text: 'JSON-LD schema across all templates; Organization schema on every page with matching NAP.', hint: 'Templates / # locations\\u2026' },\n        { id: 'o4', text: 'Author schema + linked bio page for every named contributor.', hint: 'Contributor names\\u2026' },\n        { id: 'o5', text: 'Semantic HTML audit: landmark elements, real list/heading tags, main content in the DOM within ~5 seconds.', hint: 'Owner\\u2026' },\n        { id: 'o6', text: 'Help center / documentation pages given the same structural treatment as marketing pages.', hint: 'Owner / # articles\\u2026' },\n        { id: 'o7', text: 'Recent content flagged for a recency refresh.', hint: 'Window / owner\\u2026' } ] },\n      { title: 'Crawlability & Governance', items: [\n        { id: 'c1', text: 'Written AI bot allow/block policy: OpenAI (GPTBot), Google-Extended, Anthropic (ClaudeBot), PerplexityBot, CCBot.', hint: 'Documented on (date)\\u2026' },\n        { id: 'c2', text: 'robots.txt updated to name each bot explicitly.', hint: 'Last reviewed (date)\\u2026' },\n        { id: 'c3', text: 'Server logs checked for AI-bot crawl activity and slow time-to-first-byte (HTTP 499) on priority pages.', hint: 'Owner / cadence\\u2026' },\n        { id: 'c4', text: 'Reassess the allow/block policy and robots.txt against the current bot landscape.', hint: 'Owner / quarterly\\u2026' } ] },\n      { title: 'Off-Page (beyond your site)', items: [\n        { id: 'f1', text: 'NAP data confirmed identical across Google Business Profile, Apple Maps, Yelp, Bing Places, + others.', hint: 'Other directories\\u2026' },\n        { id: 'f2', text: 'For each location: run the standard AI question list (hours, services, \"is this location good\") through ChatGPT, Gemini, Perplexity, and AI Overviews; log factual errors separately from sentiment.', hint: '# locations / owner\\u2026' },\n        { id: 'f3', text: 'Review-generation and review-response cadence in place, with specificity (service, location, outcome) as the goal.', hint: 'Owner / cadence\\u2026' },\n        { id: 'f4', text: 'GBP posted to weekly; new photos twice a month; Q&A seeded with the 3\\u20135 questions customers actually ask.', hint: 'Owner\\u2026' },\n        { id: 'f5', text: 'Location pages reviewed for fact density: NAP/hours/services structured, local FAQs, real project examples, 3 real landmark images with descriptive filenames.', hint: '# markets / owner\\u2026' },\n        { id: 'f6', text: 'Pricing ranges published with the variables that move them, rather than withheld.', hint: 'Owner\\u2026' },\n        { id: 'f7', text: 'Reddit / forum / reference-site presence list built for your category.', hint: 'Communities\\u2026' } ] },\n      { title: 'PR & Brand Authority', items: [\n        { id: 'p1', text: 'Sentiment + mention audit, branded AND brand-neutral: what the AI platforms say about you and competitors; log hedging, gaps, errors.', hint: 'Platforms\\u2026' },\n        { id: 'p2', text: 'One-sentence brand identity statement all teams point to.', hint: 'We are the provider known for\\u2026' },\n        { id: 'p3', text: 'Named contributors prioritized for bylines / interviews based on who already gets cited.', hint: 'Names\\u2026' } ] },\n      { title: 'Paid Media', items: [\n        { id: 'a1', text: 'First-party data (margin, loyalty, CRM audiences) fed into Performance Max / Demand Gen rather than relying on manual bid and keyword management.', hint: 'Owner / data sources\\u2026' },\n        { id: 'a2', text: 'Creative quality reviewed as a primary lever, not an afterthought \\u2014 it drives ~49% of incremental sales (NCSolutions).', hint: 'Owner / review cadence\\u2026' },\n        { id: 'a3', text: 'Campaign structure reviewed against AI Mode placement and agentic checkout readiness.', hint: 'Owner\\u2026' } ] },\n      { title: 'Monitoring (owner + cadence)', items: [\n        { id: 'm1', text: 'Daily \\u2014 check citations, mentions, sentiment, and crawl frequency for unusual patterns.', hint: 'Owner\\u2026' },\n        { id: 'm2', text: 'Weekly \\u2014 AI-visibility snapshot with enough prompt volume for a credible interval; track share-of-voice and branded search volume.', hint: 'Owner\\u2026' },\n        { id: 'm3', text: 'Monthly \\u2014 analyze bot crawl activity in logs; benchmark AI visibility vs. named competitors; circulate report.', hint: 'Owner\\u2026' },\n        { id: 'm4', text: 'Quarterly \\u2014 review change log vs. performance shifts; re-run the full baseline audit and the strategy document.', hint: 'Owner\\u2026' } ] },\n      { title: 'Experiments', items: [\n        { id: 'e1', text: 'Pick 2\\u20133 experiments from Part 9. Define the control group, the change, the duration, and the single success metric before starting.', hint: 'Owner / start date\\u2026' },\n        { id: 'e2', text: 'Log the result \\u2014 win, loss, or inconclusive \\u2014 and the reason, even for a null result.', hint: 'Where logged\\u2026' } ] } ];\n  }\n\n  save(data) {\n    try { localStorage.setItem('geo_playbook_checklist', JSON.stringify(data)); } catch (e) {}\n  }\n\n  onToggle = (e) => {\n    const id = e.target.dataset.id;\n    const data = { ...this.state.data, [id]: { ...(this.state.data[id] || {}), checked: e.target.checked } };\n    this.save(data); this.setState({ data });\n  };\n\n  onNote = (e) => {\n    const id = e.target.dataset.id;\n    const data = { ...this.state.data, [id]: { ...(this.state.data[id] || {}), notes: e.target.value } };\n    this.save(data); this.setState({ data });\n  };\n\n  resetChecklist = () => { this.save({}); this.setState({ data: {} }); };\n\n  renderVals() {\n    const d = this.state.data || {};\n    const checklist = this._defs.map(g => ({\n      title: g.title,\n      items: g.items.map(it => {\n        const s = d[it.id] || {};\n        return { id: it.id, text: it.text, hint: it.hint, checked: !!s.checked, notes: s.notes || '',\n          textStyle: { fontFamily: \"'Quicksand', sans-serif\", fontSize: '15.5px', lineHeight: '1.42',\n            color: s.checked ? '#9AA0AC' : '#3E4658', textDecoration: s.checked ? 'line-through' : 'none',\n            display: 'block' } };\n      })\n    }));\n    const total = this._defs.reduce((a, g) => a + g.items.length, 0);\n    const done = Object.values(d).filter(v => v && v.checked).length;\n    const pct = total ? Math.round((done / total) * 100) : 0;\n\n    return {\n      checklist,\n      onToggle: this.onToggle, onNote: this.onNote, resetChecklist: this.resetChecklist,\n      progressPct: pct + '%',\n      progressLabel: done + ' / ' + total + ' done',\n      toc: [\n        { num: '\\u2014', title: 'Key Takeaways', desc: 'The book in twelve points' },\n        { num: '\\u2713', title: 'The Adaptable Checklist', desc: 'Fill-in version of every action item' },\n        { num: '1', title: 'The Shift', desc: \"What's changing and why it matters\" },\n        { num: '2', title: 'Research & Audit', desc: 'Know what you\\u2019re optimizing for first' },\n        { num: '3', title: 'On-Page', desc: 'Fix your own site, in order' },\n        { num: '4', title: 'Off-Page', desc: 'Fix what\\u2019s beyond your site' },\n        { num: '5', title: 'PR & Brand Authority', desc: 'Shape what AI says about you' },\n        { num: '6', title: 'Paid Media in the AI Era', desc: 'AI Mode ads and agentic commerce' },\n        { num: '7', title: 'Measurement', desc: 'What tells you it\\u2019s working' },\n        { num: '8', title: 'Governance', desc: 'The AI-crawler decision underneath it all' },\n        { num: '9', title: 'Experiment & Automation', desc: 'Tests to run, and the loops to automate' }\n      ],\n      takeaways: [\n        { num: '01', head: 'Search is splitting into two systems', body: 'Traditional results and AI answer engines now sit side by side. Rankings and CTR measure a shrinking share of how people find a business \\u2014 and 94% of enterprises plan to increase AEO/GEO spend in 2026 (Conductor, via Shelley Walsh).' },\n        { num: '02', head: 'Research comes before optimization', body: 'Knowing the exact phrases customers type into ChatGPT, Copilot, and Google AI Mode \\u2014 not what you assume \\u2014 is what makes every later step target the right thing.' },\n        { num: '03', head: \"AI doesn't read a page like a crawler\", body: 'LLMs tokenize content and evaluate semantic clarity, not markup. Clear headings, one idea per paragraph, and an answer in the first sentence matter more than schema (Carolyn Shelby).' },\n        { num: '04', head: 'Scaling AI content is the top strategy \\u2014 and top failure', body: 'Google has issued manual actions for scaled AI content abuse (Pedro Dias) and downgrades low-effort AI content regardless of how it was produced (John Mueller).' },\n        { num: '05', head: 'Entity consistency is the off-page foundation', body: 'The same name, address, phone, and description everywhere is what keeps AI from treating one business as several. The single highest-leverage fix for multi-location brands.' },\n        { num: '06', head: 'AI is already getting your locations wrong', body: 'Vendor testing found 93% of London businesses tested had at least one basic fact wrong or missing in AI answers, with smaller businesses faring worse. No report flags this \\u2014 it has to be checked manually.' },\n        { num: '07', head: 'Being mentioned beats being linked', body: 'LLMs synthesize the entire web into one answer, so how a brand is talked about across sites you don\\u2019t own carries more weight than one cited page (Mordy Oberstein).' },\n        { num: '08', head: 'The old dashboard is going dark', body: 'Clicks and rankings don\\u2019t capture AI visibility, and platforms don\\u2019t expose referral data. Ask instead: are you the recommended solution throughout the journey, and can you track influence through real conversion paths?' },\n        { num: '09', head: 'Personalization needs the right architecture', body: 'Page-based CMS platforms force personalization into expensive one-off builds. Component-based content with a named owner and a review rhythm is what makes it sustainable (Gabriel Dillon).' },\n        { num: '10', head: 'Paid media is being rebuilt around the same shift', body: 'Google is explicit that it\\u2019s designing ads so \"the best ads are just answers,\" placing them inside AI Mode conversations and agentic checkout. First-party data now outweighs manual keyword and bid management.' },\n        { num: '11', head: 'AI-crawler access is now a decision', body: 'A growing number of publishers block AI crawlers unless compensated. That setting deserves the same quarterly review as any technical item (Matthew Prince, Cloudflare).' },\n        { num: '12', head: 'A single visibility score is closer to noise', body: 'AI answers are stochastic \\u2014 the same prompt run twice can differ. Treat any tracking number as a trend across repeated snapshots, and always run brand-neutral prompts: naming a brand inflates its apparent visibility roughly five-fold (Ben Moore).' }\n      ],\n      shiftStats: [\n        { stat: '1B+', label: 'monthly users on Google AI Mode (Google I/O 2026)' },\n        { stat: '~3\\u00d7', label: 'longer than traditional Search queries \\u2014 a direct sign of assistant-style behavior' }\n      ],\n      scoreboard: [\n        { old: 'Content', new: 'Context + sentiment', bg: '#fff' },\n        { old: 'Keywords', new: 'Intent', bg: '#F5F2EC' },\n        { old: 'Brand', new: 'Brand + sentiment', bg: '#fff' },\n        { old: 'Rankings', new: 'Mentions', bg: '#F5F2EC' },\n        { old: 'Links from external sources', new: 'Citations across channels', bg: '#fff' },\n        { old: 'SERP monopoly', new: 'Share of voice', bg: '#F5F2EC' },\n        { old: 'E-E-A-T', new: 'Still E-E-A-T', bg: '#fff' },\n        { old: 'Structured data', new: 'Entities, knowledge graph, embeddings', bg: '#F5F2EC' },\n        { old: 'Answering', new: 'Assisting', bg: '#fff' }\n      ],\n      strategyParts: [\n        { n: '1', title: 'The challenge', desc: 'One sentence naming the actual business problem \\u2014 not \"we should do GEO.\"' },\n        { n: '2', title: 'The approach', desc: 'Which lever you\\u2019ll pull: third-party authority, proprietary data competitors can\\u2019t reproduce, or case studies and customer evidence.' },\n        { n: '3', title: 'The tactics', desc: 'Only now the execution items from Parts 3\\u20136 \\u2014 chosen because they serve the approach, not because they were on a checklist.' }\n      ],\n      baseline: [\n        { n: '1', q: 'Where does the brand already show up?', a: 'Ask the AI platforms your customers use category questions; record which brands get named.' },\n        { n: '2', q: 'Who else is getting cited?', a: 'Find the third-party sites AI tools cite \\u2014 and which mention competitors but not you.' },\n        { n: '3', q: 'Which of your pages are citation-worthy?', a: 'Cross-reference organic-traffic pages against pages that appear in AI answers. A gap points to a structural fix.' },\n        { n: '4', q: 'Where do you stand vs. named competitors?', a: 'Benchmark against your top 1 and top 3 named competitors, not the category in general.' }\n      ],\n      sources2: [\n        { name: 'Google Search Console', desc: 'export top queries, filter for question phrasing' },\n        { name: 'AI Overviews + \"People Also Ask\"', desc: 'expand every question; ~40\\u201350 raw questions in 6\\u20138 searches' },\n        { name: 'Copilot & ChatGPT', desc: 'ask directly for common category questions \\u2014 validate, don\\u2019t finalize' },\n        { name: 'Customer surveys', desc: 'most underused, most authentic; 20\\u201330 responses \\u2192 10\\u201315 distinct prompts' },\n        { name: 'Sales team insight', desc: 'discovery calls, demos, RFPs \\u2014 the real buying language already in your CRM' },\n        { name: 'Reddit & industry forums', desc: 'blunt, unpolished phrasing in the same register as AI prompts' }\n      ],\n      promptStats: [\n        { stat: '71%', label: 'longer: real prompts averaged 15.1 words vs. 8.8 for estimated ones' },\n        { stat: '78.9%', label: 'of real prompts showed tool-finding intent (vs. 62.5%)' },\n        { stat: '52.1%', label: 'used personal pronouns \\u2014 \"I\", \"my\", \"me\" (vs. 18.8%)' },\n        { stat: '~3\\u00d7', label: 'more likely to be phrased as a problem to solve (21.1% vs. 7.1%)' }\n      ],\n      lenses: [\n        { title: 'Lens 1 \\u2014 Who are the market players?', desc: 'Questions answered by naming a company: leading providers by general reputation, affordability, the customer segment served, region/locality, and trust or track record.' },\n        { title: 'Lens 2 \\u2014 What makes an option worth choosing?', desc: 'Questions answered by describing a quality without naming a brand: performance, support and reliability after the sale, price and contract flexibility, ease of use, and fit for a specific use case.' }\n      ],\n      qualityKeep: ['Sounds like a real human search', 'Leads an AI tool to name providers or describe a clear quality', 'Sits mid-to-bottom of the funnel', 'Is specific to one category', 'Mixes short keyword phrasing with longer natural-language questions'],\n      qualityCut: ['Names a brand \\u2014 yours or a competitor\\u2019s', 'Directly compares two named competitors (\"X vs. Y\")', 'Reads like an article headline', 'Is a near-duplicate of one already on the list'],\n      ragSteps: [\n        { n: '1', text: 'The AI decides whether the query needs outside information at all \\u2014 simple factual questions are answered straight from training.' },\n        { n: '2', text: 'If it does, the model expands the query into several sub-queries, sends them to a search index, and collects results \\u2014 query fan-out.' },\n        { n: '3', text: 'Title, meta description, and URL help determine which candidate pages get read in full and cited.' }\n      ],\n      retrievalFindings: [\n        { stat: '44.2%', title: 'of citations come from the first 30% of a page', body: 'Middle third: 31.1%. Bottom third: 24.7%. The rule is the opposite of essay writing \\u2014 answer the question in the first sentence below a subheading, not at the end.', who: 'KEVIN INDIG, 1.2M CHATGPT CITATIONS' },\n        { stat: '20.6%', title: 'entity density in the most-cited content', body: 'Roughly one in five words is a specific named thing \\u2014 a tool, brand, person, or study \\u2014 versus 5\\u20138% in average content. Vague phrasing gives retrieval fewer anchor points to match against.', who: 'KEVIN INDIG' },\n        { stat: '~2s', title: 'page-speed cutoff, not a ranking factor', body: 'ChatGPT appears to fetch on a ~2-second timeout; slow TTFB can truncate content before the model reads past the head tag. Check server logs for HTTP 499 as an AI-specific speed signal.', who: 'DAVID MCSWEENEY / JAN-WILLEM BOBBINK' }\n      ],\n      fanoutPatterns: ['Disambiguation', 'Entity attributes', 'Journey stages', 'Trust signals', 'Comparison criteria', 'Time-sensitivity'],\n      patterns: [\n        { n: '1', text: 'Clear headings with proper H1\\u2013H3 nesting.' },\n        { n: '2', text: 'Short, self-contained paragraphs \\u2014 one idea each.' },\n        { n: '3', text: 'Structured formats: lists for steps, tables for comparisons, FAQ for Q&A.' },\n        { n: '4', text: 'The key point stated at the top, not the bottom.' },\n        { n: '5', text: 'Semantic signposting: \"in summary\", \"the most important\", \"step 1\".' }\n      ],\n      passageFramework: [\n        { title: 'Start with real questions', desc: 'Customer interviews first, then keyword tools, Reddit, YouTube comments, and fan-out tools. Group by underlying intent \\u2014 understanding, comparing, and how-to are three different treatments.' },\n        { title: 'Hub-and-spoke clusters', desc: 'One pillar page summarizing the topic, deep-linking to spokes that each go deep on a sub-topic, cross-linked contextually inside body copy \\u2014 not only in navigation.' },\n        { title: 'Passage-first blocks', desc: '40\\u201360 words per block, one micro-question each: answer, then supporting detail. Problem, why it matters, steps, example. Sections 150\\u2013250 words on a single idea.' },\n        { title: 'Headings that carry information', desc: '\"Overview\" and \"Introduction\" waste a heading\\u2019s signal. \"How EV Battery Range Changes in Winter\" embeds the entities and modifiers a sub-query would use. One H1; nest for hierarchy, never for styling.' },\n        { title: 'Contextual jump links', desc: 'Anchor links placed at the exact point in the text where they\\u2019re relevant \\u2014 \"fraggles,\" a concept credited to Cindy Krum \\u2014 help LLMs zero in on the micro-answer a narrow query wants.' },\n        { title: 'Cite inline, and differentiate', desc: 'Sources next to the claim they support, not only in a bottom reference list. AI Overviews favor diversity \\u2014 a page that restates what competitors say has a structural disadvantage.' }\n      ],\n      onpageTopics: [\n        { title: 'Content structure', groups: [\n          { tag: 'For every piece', items: ['Answer the primary question in the first 1\\u20132 sentences of a section', 'Question-based headings that mirror how customers actually search (from Part 2)', 'Lead each section with a self-contained answer that still makes sense quoted alone', 'Include a summary / key-takeaways block near the top', 'Match format to content: tables for comparisons, numbered lists for steps, prose for explanation', 'Define jargon on first use', 'One original element per page \\u2014 proprietary data, a quote, or a POV; cite original sources, not aggregators'] },\n          { tag: 'Monthly', items: ['Identify which pages are actually getting cited in AI answers; note what they share', 'Cross-reference against strong-traffic pages with zero AI citations \\u2014 that gap is usually structural'] },\n          { tag: 'Quarterly', items: ['Refresh anything published in the last 3\\u20136 months with current data and examples \\u2014 recency is a trust signal'] } ] },\n        { title: 'Crawlability', groups: [\n          { tag: 'One-time setup', items: ['Document an explicit AI-bot allow/block strategy in writing, with the reasoning', 'Configure robots.txt to name major AI bots explicitly, not a generic wildcard', 'Establish a topic-cluster architecture with pillar pages', 'Implement canonical tags across every indexable page'] },\n          { tag: 'As content ships', items: ['Link new content to and from its related pillar page', 'Use anchor text that describes the linked topic, not generic phrases', 'Add newly published pages to the XML sitemap immediately'] },\n          { tag: 'Monthly & quarterly', items: ['Review server logs for AI-bot crawl activity; investigate unexpected blocks, drops, or HTTP 499s', 'Audit for orphan pages \\u2014 link them in or deprecate', 'Audit canonical implementation site-wide (quarterly)', 'Update robots.txt and reassess the allow/block strategy against the current bot landscape'] } ] },\n        { title: 'Technical health & authority', groups: [\n          { tag: 'One-time setup', items: ['Implement JSON-LD schema across every page template', 'Organization schema site-wide with consistent NAP \\u2014 the top fix for multi-location businesses', 'Person schema on every author bio, with sameAs links to verified profiles', 'Document which schema types apply to which templates'] },\n          { tag: 'Ongoing', items: ['Validate schema with the Rich Results Test before publishing, not after', 'Confirm critical content loads in HTML, not client-side JS \\u2014 in the DOM within ~5 seconds', 'Spot-check new pages with JavaScript disabled; flag gaps to engineering'] },\n          { tag: 'Monthly & quarterly', items: ['Run a site-wide schema audit for errors and mismatches', 'Review Core Web Vitals across key content', 'Review schema.org for new relevant types'] } ] }\n      ],\n      semanticItems: [\n        'Wrap content in <main><article>; break topics apart with <section> plus proper heading tags',\n        'Use real <ul>, <ol>, <blockquote>, and <figure> elements rather than visually faking them',\n        'Use <p> tags for spacing rather than stacked <br> tags',\n        'Use landmark elements \\u2014 header, nav, main, aside, footer \\u2014 not one undifferentiated div',\n        'Accessibility work doubles as crawlability work: meaningful alt text, labeled form controls, descriptive link text'\n      ],\n      helpCenter: [\n        'Give every documentation page a real heading hierarchy instead of one long unstructured article',\n        'Add an FAQ block addressing the specific follow-ups a user would have about that feature',\n        'Convert step-by-step instructions into numbered lists rather than paragraphs',\n        'Build an internal link module connecting each article to related setup, integration, and troubleshooting pages',\n        'Add breadcrumb navigation so users and crawlers can see where the article sits in the wider set'\n      ],\n      arch: [\n        { name: 'The failure pattern (Gabriel Dillon)', desc: 'A team requests a tailored page and three weeks later gets a duplicated page with hardcoded copy, while the email stream stays generic. One dev sprint, exactly one surface.' },\n        { name: 'The diagnosis', desc: 'When a CMS treats content as monolithic pages, personalization can only happen at the page level. Real personalization needs content broken into components assembled by context \\u2014 which most page-based platforms aren\\u2019t built to do.' },\n        { name: 'The common workaround, and its cost', desc: 'Bolting on a third-party personalization script adds latency, layout shift, visible flicker, and degraded Core Web Vitals \\u2014 plus governance living outside the CMS the team already built.' },\n        { name: 'Where to start', desc: 'Paid landing pages (the audience signal is already in the ad) and the new-vs-returning split on high-traffic organic pages. Run it as an ongoing capability with a named owner \\u2014 not a one-time project.' }\n      ],\n      scalingQuotes: [\n        { who: 'Aleyda Sol\\u00eds', quote: 'A personalized editorial and optimization workflow is required to ensure quality, originality, and expertise \\u2014 exactly what AI platforms are likely to cite.' },\n        { who: 'Eli Schwartz', quote: 'Leaders are somewhat skeptical about mass AI content, but afraid of being left behind if they don\\u2019t do this.' },\n        { who: 'Lily Ray', quote: 'Just because it\\u2019s easy doesn\\u2019t mean it\\u2019s a good idea.' },\n        { who: 'Shushrita M.', quote: 'A sudden decline does not automatically mean your content is bad. Recovery starts with diagnosis, not panic.' }\n      ],\n      recovery: [\n        { n: '1st', title: 'Trust and reputation', desc: 'Real author credentials on content; built-out About, Contact, and customer-service pages; genuine reviews displayed, with public responses to negative feedback.' },\n        { n: '2nd', title: 'Content originality', desc: 'Rewrite pages that mostly restate competitors from real experience or a new angle. For reviews, actually use the product and add original images or video.' },\n        { n: '3rd', title: 'UX and freshness', desc: 'Audit navigation, readability, and menu clarity against real behavioral signals. Set a recurring refresh process; merge or remove posts with no clear purpose.' },\n        { n: '4th', title: 'Prune low-value pages', desc: 'Reduce or noindex thin pages on topics where the site has no real expertise \\u2014 they dilute the quality signal for the whole site.' },\n        { n: 'LAST', title: 'Technical improvements', desc: 'Page speed, Core Web Vitals, clean schema play a supporting role \\u2014 but across recovered sites they were rarely the primary cause of recovery on their own.' }\n      ],\n      offpage: [\n        { name: 'Community discussion', desc: 'Reddit threads and industry forums, where AI tools increasingly pull real, unpolished answers. Reddit is the most-cited source in Google AI Overviews at 21% of citations; YouTube follows at 18.8% (Averi.ai).' },\n        { name: 'Reference sources', desc: 'Wikipedia and category-standard reference sites, where a factual, well-sourced presence carries weight.' },\n        { name: 'Earned media & digital PR', desc: 'Getting named accurately in industry publications and local press.' },\n        { name: 'Content partnerships', desc: 'Contributing to or being referenced by sites that already rank and get cited in your category.' }\n      ],\n      accuracyStats: [\n        { stat: '93%', label: 'of 165 London businesses tested had at least one basic fact wrong or missing in AI answers' },\n        { stat: '1 in 16', label: 'answers about UK high street retailers were incorrect; wrong postcodes hit 1 in 10 even when the prompt named the town' },\n        { stat: '50%', label: 'of smaller businesses got at least one false fact, versus 32% of larger companies' },\n        { stat: '10% / 5% / 4%', label: 'inaccuracy rates for Perplexity, Gemini, and ChatGPT respectively in the retail dataset' }\n      ],\n      locationAudit: [\n        { n: '1', text: 'Write a standard set of questions a real customer would ask \\u2014 hours, services, \"is this location any good.\"' },\n        { n: '2', text: 'Run the identical list through AI Overviews, AI Mode, ChatGPT, Gemini, and Perplexity separately. A location that checks out in one can be misdescribed in another.' },\n        { n: '3', text: 'Ask each question more than once \\u2014 answers vary between runs.' },\n        { n: '4', text: 'Sort results into factual errors, missing information, and perception issues. The first two are corrections; the third is a reputation problem.' },\n        { n: '5', text: 'Prioritize anything that stops a customer showing up at all \\u2014 wrong hours, a location reported as closed.' },\n        { n: '6', text: 'Fix the sources you control first, then work through the third-party sources an answer cites. Keep checking: fixing a source today doesn\\u2019t update an answer already generated.' }\n      ],\n      localContext: [\n        { stat: '15%', label: 'of direct local-intent searches show AI Overviews \\u2014 but 92% of informational and 97% of hybrid questions do (Whitespark)' },\n        { stat: '93%', label: 'of direct local-intent searches still show a local pack \\u2014 AI Overviews are an informational phenomenon, not yet a local-search replacement' },\n        { stat: '1.2%', label: 'of 350,000+ locations were recommended by ChatGPT \\u2014 far below the same brands\\u2019 local 3-pack rate (SOCi)' },\n        { stat: '45%', label: 'of consumers now use ChatGPT or similar for local business recommendations, up from 6% a year earlier (BrightLocal)' }\n      ],\n      locationPages: [\n        { title: 'Information architecture', desc: 'NAP, service area, and hours in table or labeled format; testimonials from that city with neighborhood references; market-specific FAQs (permits, regulations, climate); real project examples; a structured grid for regional pricing or tiers.' },\n        { title: 'Geographic legitimacy', desc: 'Three real landmark images per page (a primary icon, people in the area with a landmark visible, and a full-width third shot), filed under descriptive names with location-naming alt text. Technique credited to Steve Toth. Stock photography reads to vision AI as low-context boilerplate.' },\n        { title: 'Entity consistency', desc: 'Yelp, Google, Bing, Apple Maps, and industry listings all saying exactly the same thing \\u2014 audited quarterly. Conflicting NAP data on even one of fifteen directories measurably lowers confidence in the entity.' }\n      ],\n      gbp: [\n        { when: 'WITHIN 24H / 48H', title: 'Reviews', desc: 'Request within 24 hours of a completed service, while it\\u2019s fresh. Respond to every review within 48 hours \\u2014 owner responses are an engagement signal, not just a courtesy. A copy-paste \"thanks\" doesn\\u2019t carry it.' },\n        { when: 'WEEKLY', title: 'Posts', desc: 'Tied to something actually happening \\u2014 a promotion, a finished project, a local event. Use the \"Offer\" type for time-sensitive content, since the expiry date itself signals recency.' },\n        { when: 'TWICE MONTHLY', title: 'Photos', desc: 'Real work, current team, job-site before/afters over stock imagery. A batch of 50 uploaded once a year doesn\\u2019t send the same freshness signal as steady uploads (Birdeye).' },\n        { when: 'ONE-TIME + UPKEEP', title: 'Booking & Q&A', desc: 'Connect a booking link wherever appointments are supported, and seed Q&A with the 3\\u20135 questions customers actually ask \\u2014 answered by the business before a stranger answers them incorrectly.' }\n      ],\n      citationPlays: [\n        { n: '1', title: 'Move answers onto commercial pages', desc: 'FAQ sections, cost breakdowns, and short how-to answers on the page itself, not buried in a separate blog \\u2014 44.2% of citations come from the first 30% of a page.' },\n        { n: '2', title: 'Audit directory alignment quarterly', desc: 'Conflicting NAP data across even one of fifteen directories measurably lowers an AI system\\u2019s confidence in the entity.' },\n        { n: '3', title: 'Build on Reddit and YouTube specifically', desc: 'Reddit is the most-cited source in Google AI Overviews at 21% of all citations, with YouTube at 18.8% (Averi.ai).' },\n        { n: '4', title: 'Publish proprietary local data', desc: 'An original cost report, aggregated satisfaction data, a local market benchmark \\u2014 an LLM has to cite the original when nothing else exists to substitute.' },\n        { n: '5', title: 'Maintain a freshness cadence', desc: 'Ahrefs\\u2019 analysis of 17 million AI citations found AI-cited content runs ~25.7% fresher on average than traditionally ranked content.' }\n      ],\n      quickAudit: [\n        { n: '1', title: 'Brand query', desc: 'Ask \"tell me about [business] in [city]\" and note what\\u2019s stale or flat-out wrong.' },\n        { n: '2', title: 'Customer query', desc: 'Ask the customer\\u2019s actual problem \\u2014 \"best [category] near [area] for [need]\" \\u2014 and note whether the business shows up at all, and who does instead.' },\n        { n: '3', title: 'Deep-dive prompt', desc: 'What customers say the business is known for, how it compares to its top three competitors, strengths and weaknesses in reviews, with sources cited.' },\n        { n: '4', title: 'Repeat per location', desc: 'Run all three on two or three individual locations \\u2014 answers frequently diverge location to location.' }\n      ],\n      offpageCadence: [\n        { tag: 'One-time setup', items: ['Complete About page with Organization schema \\u2014 establishes the entity off-page sources reference', 'Visible, genuinely-earned trust signals: certifications, awards, press mentions, client logos'] },\n        { tag: 'Ongoing', items: ['Link out to 2\\u20133 authoritative external sources in longform \\u2014 signals you\\u2019re engaging with the category, not just repeating it'] },\n        { tag: 'Monthly & quarterly', items: ['Audit new content for outbound link quality and freshness', 'Audit brand sentiment and entity consistency across third-party sites', 'Review trust signals for accuracy \\u2014 an expired certification does more harm than good', 'Run an entity-consistency audit across every owned property and directory listing'] }\n      ],\n      prCards: [\n        { n: '01', title: 'Mentions are the goal, not citations', body: 'ChatGPT isn\\u2019t built to drive citations \\u2014 it\\u2019s built to answer and keep the conversation going, and a citation typically doesn\\u2019t appear until several prompts in. How your brand is talked about carries weight independent of wheth
