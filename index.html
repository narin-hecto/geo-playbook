  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x; border-radius: 50%; border: 60px solid rgba(254,105,1,.12);\"><\u002Fdiv>\n    <div style=\"position: absolute; bottom: -220px; right: 180px; width: 360px; height: 360px; border-radius: 50%; background: rgba(254,105,1,.08);\"><\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2;\">\n      <div style=\"display: flex; align-items: center; gap: 16px;\">\n        <img src=\"8b0c6dba-b421-4468-8cc8-571f887c03f7\" alt=\"Hecto\" style=\"width: 46px; height: 46px; object-fit: contain;\">\n        <span style=\"font-weight: 700; letter-spacing: .32em; font-size: 15px; color: #fff;\">HECTO MARKETING<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-weight: 600; letter-spacing: .24em; font-size: 13px; color: rgba(255,255,255,.55);\">FIELD PLAYBOOK · 2026<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .22em; font-size: 17px; color: #FE6901; margin-bottom: 26px;\">THE GEO/AEO PLAYBOOK<\u002Fdiv>\n      <h1 style=\"font-weight: 800; font-size: 104px; line-height: .96; color: #fff; letter-spacing: -.02em; max-width: 1050px; text-wrap: pretty;\">What's changing in search — and what to do about it, in order.<\u002Fh1>\n      <p style=\"font-size: 24px; line-height: 1.5; color: rgba(255,255,255,.72); max-width: 760px; margin-top: 34px;\">A practical, step-by-step guide to optimizing for AI answer engines and traditional search at the same time — research, on-page, off-page, PR, paid, measurement, governance, and the experiments to run next.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 60px; position: relative; z-index: 2; border-top: 1px solid rgba(255,255,255,.14); padding-top: 30px;\">\n      <div><div style=\"font-weight: 800; font-size: 40px; color: #FE6901;\">9<\u002Fdiv><div style=\"font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">PARTS<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 800; font-size: 40px; color: #FE6901;\">12<\u002Fdiv><div style=\"font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">KEY TAKEAWAYS<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 800; font-size: 40px; color: #FE6901;\">1<\u002Fdiv><div style=\"font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">FILL-IN CHECKLIST<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 800; font-size: 40px; color: #FE6901;\">20<\u002Fdiv><div style=\"font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">TESTABLE EXPERIMENTS<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CONTENTS ============ -->\n  <section data-screen-label=\"Contents\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px; position: relative;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #22314D; padding-bottom: 18px; margin-bottom: 46px;\">\n      <div style=\"font-weight: 700; letter-spacing: .22em; font-size: 14px; color: #22314D;\">CONTENTS &amp; HOW TO USE THIS<\u002Fdiv>\n      <div style=\"font-weight: 600; letter-spacing: .18em; font-size: 12px; color: #FE6901;\">HECTO MARKETING<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.15fr 1fr; gap: 70px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n        <sc-for list=\"{{ toc }}\" as=\"row\" hint-placeholder-count=\"11\">\n          <div style=\"display: flex; align-items: baseline; gap: 22px; padding: 13px 0; border-bottom: 1px solid #E4DFD4;\">\n            <span style=\"font-weight: 800; font-size: 20px; color: #FE6901; min-width: 34px;\">{{ row.num }}<\u002Fspan>\n            <div style=\"flex: 1;\">\n              <div style=\"font-weight: 700; font-size: 19px; color: #22314D;\">{{ row.title }}<\u002Fdiv>\n              <div style=\"font-size: 15px; color: #6A7284; margin-top: 2px;\">{{ row.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 44px 42px; align-self: start;\">\n        <div style=\"font-weight: 700; letter-spacing: .18em; font-size: 13px; color: #FE6901; margin-bottom: 20px;\">READ IT IN ORDER<\u002Fdiv>\n        <p style=\"font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82); margin-bottom: 18px;\">Search is splitting into two systems: traditional results and AI answer engines. This playbook covers both, and the sequence matters.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82); margin-bottom: 18px;\">Start with <strong style=\"color:#fff;\">research<\u002Fstrong> so every later step targets the right thing. Then work outward: your own pages, the wider web, PR, paid media, and how you measure it.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82); margin-bottom: 18px;\">The <strong style=\"color:#fff;\">Adaptable Checklist<\u002Fstrong> is the whole book stripped to action — fill it in for one business and hand it off.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82);\">Part 9 turns the rest into <strong style=\"color:#fff;\">hypotheses to test<\u002Fstrong>, not rules to apply everywhere at once.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ KEY TAKEAWAYS ============ -->\n  <section data-screen-label=\"Key Takeaways\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px;\">\n      <div>\n        <div style=\"font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">THE BOOK IN TWELVE POINTS<\u002Fdiv>\n        <h2 style=\"font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">Key Takeaways<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"font-weight: 800; font-size: 20px; color: #E4DFD4;\">01<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ takeaways }}\" as=\"t\" hint-placeholder-count=\"12\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 30px 30px 32px; display: flex; flex-direction: column;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n            <span style=\"font-weight: 800; font-size: 26px; color: #FE6901;\">{{ t.num }}<\u002Fspan>\n            <span style=\"height: 1px; flex: 1; background: #EBE6DB;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-weight: 700; font-size: 20px; line-height: 1.2; color: #22314D; margin-bottom: 12px; text-wrap: pretty;\">{{ t.head }}<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.55; color: #545C6E;\">{{ t.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ADAPTABLE CHECKLIST ============ -->\n  <section data-screen-label=\"Adaptable Checklist\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;\">\n      <div>\n        <div style=\"font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">FILL-IN VERSION OF EVERY ACTION ITEM<\u002Fdiv>\n        <h2 style=\"font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">The Adaptable Checklist<\u002Fh2>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ resetChecklist }}\" style=\"font-weight: 600; font-size: 13px; letter-spacing: .06em; color: #22314D; background: transparent; border: 1px solid #C9C2B4; border-radius: 40px; padding: 10px 20px; cursor: pointer; margin-top: 8px;\" style-hover=\"border-color: #FE6901; color: #FE6901;\">Reset checklist<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"font-size: 18px; line-height: 1.55; color: #545C6E; max-width: 820px; margin-bottom: 12px;\">Grouped in the order you'd execute it. Check items off and fill in the blanks for one specific business — your entries save automatically in this browser.<\u002Fp>\n    <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 40px;\">\n      <div style=\"flex: 1; height: 8px; background: #E7E2D7; border-radius: 6px; overflow: hidden;\"><div style=\"height: 100%; background: #FE6901; border-radius: 6px; width: {{ progressPct }}; transition: width .25s ease;\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-weight: 700; font-size: 14px; color: #22314D; min-width: 116px; text-align: right;\">{{ progressLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px;\">\n      <sc-for list=\"{{ checklist }}\" as=\"group\" hint-placeholder-count=\"7\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 30px; break-inside: avoid;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n            <span style=\"width: 8px; height: 22px; background: #FE6901; border-radius: 2px;\"><\u002Fspan>\n            <h3 style=\"font-weight: 700; font-size: 19px; color: #22314D; letter-spacing: .01em;\">{{ group.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 13px; align-items: flex-start;\">\n                <input type=\"checkbox\" checked=\"{{ item.checked }}\" data-id=\"{{ item.id }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width: 19px; height: 19px; margin-top: 3px; accent-color: #FE6901; flex-shrink: 0; cursor: pointer;\">\n                <div style=\"flex: 1;\">\n                  <label style=\"{{ item.textStyle }}\">{{ item.text }}<\u002Flabel>\n                  <input type=\"text\" placeholder=\"{{ item.hint }}\" value=\"{{ item.notes }}\" data-id=\"{{ item.id }}\" sc-camel-on-change=\"{{ onNote }}\" sc-camel-on-input=\"{{ onNote }}\" style=\"margin-top: 7px; width: 100%; font-size: 14px; color: #22314D; background: #FAF8F3; border: none; border-bottom: 1.5px solid #E0DACC; padding: 5px 4px; outline: none;\" style-focus=\"border-color: #FE6901;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 1 ============ -->\n  <section data-screen-label=\"Part 1 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">1<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART ONE<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">The Shift<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 640px;\">What's actually changing, and why it matters.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 1\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 34px; color: #22314D; line-height: 1.08; margin-bottom: 22px; letter-spacing: -.01em; text-wrap: pretty;\">Search is splitting into two systems<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.66; color: #3E4658; margin-bottom: 18px;\">For 25 years search worked one way: type a query, get ten blue links, click one. <strong>Alex Moss<\u002Fstrong> (Search Engine Journal, May 2025) marks the last 12 months as the point that model stopped being the default. AI Overviews, AI Mode, and assistant-style products now sit between a query and a click — often answering the question before a user sees a link.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.66; color: #3E4658; margin-bottom: 18px;\">Moss frames this as a move from <em>answer engines<\u002Fem> to <em>assistant engines<\u002Fem>. An answer engine gives you a fact. An assistant engine holds a conversation, remembers context, and decides what to show based on that accumulated context — a fundamentally different retrieval flow than SEO was built for.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.66; color: #3E4658; margin-bottom: 22px;\">Her point isn't that organic SEO is dead. It's that click-through rate — the metric SEO has leaned on for two decades — now measures a shrinking share of what actually happens when someone searches.<\u002Fp>\n        <div style=\"display: flex; gap: 20px;\">\n          <sc-for list=\"{{ shiftStats }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <div style=\"flex: 1; background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 22px 24px;\">\n              <div style=\"font-weight: 800; font-size: 34px; color: #FE6901; line-height: 1;\">{{ s.stat }}<\u002Fdiv>\n              <p style=\"font-size: 14.5px; line-height: 1.42; color: #545C6E; margin-top: 9px;\">{{ s.label }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 4px;\">The old scoreboard doesn't measure the new game<\u002Fdiv>\n        <div style=\"font-style: italic; font-size: 15px; color: #6A7284; margin-bottom: 18px;\">Moss's comparison of what used to count vs. what counts now.<\u002Fdiv>\n        <div style=\"border: 1px solid #E4DFD4; border-radius: 5px; overflow: hidden;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; background: #22314D;\">\n            <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .04em; color: rgba(255,255,255,.6); padding: 12px 18px;\">USED TO MATTER<\u002Fdiv>\n            <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #FE6901; padding: 12px 18px;\">NOW MATTERS MORE<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ scoreboard }}\" as=\"r\" hint-placeholder-count=\"9\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; background: {{ r.bg }};\">\n              <div style=\"font-size: 15.5px; color: #6A7284; padding: 11px 18px;\">{{ r.old }}<\u002Fdiv>\n              <div style=\"font-size: 15.5px; font-weight: 500; color: #22314D; padding: 11px 18px;\">{{ r.new }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.55; color: #545C6E; margin-top: 16px;\">Two things stand out: E-E-A-T got <em>more<\u002Fem> important, not less — and almost every other item on the right is harder to measure with the tools most teams already have. That gap is why measurement gets its own part.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 20px; margin-top: 44px; background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 34px 40px; align-items: center;\">\n      <div style=\"font-weight: 800; font-size: 76px; color: #FE6901; line-height: .9;\">94%<\u002Fdiv>\n      <div style=\"width: 1px; height: 74px; background: #FBD9BE;\"><\u002Fdiv>\n      <p style=\"font-size: 19px; line-height: 1.55; color: #22314D; max-width: 900px;\">of enterprise organizations plan to <strong>increase AEO/GEO investment in 2026<\u002Fstrong> — now their top marketing priority, above paid media and paid search. Scaling AI-generated content was the most common strategy <em>and<\u002Fem> the most common challenge. <span style=\"color:#6A7284;\">(Conductor 2026 State of AEO/GEO CMO Investment Report, 250+ executives across 12 industries, via Shelley Walsh, SEJ.)<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 2 ============ -->\n  <section data-screen-label=\"Part 2 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">2<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART TWO<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Research &amp; Audit<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">Know what you're optimizing for before you touch anything.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 2\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <p style=\"font-size: 20px; line-height: 1.6; color: #3E4658; max-width: 1000px; margin-bottom: 40px;\">Everything in Parts 3–6 works better, and costs less, if it starts from real evidence of what your customers actually ask AI tools and where your brand already stands. This comes first because it should happen first.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1.1fr; gap: 20px; margin-bottom: 44px;\">\n      <div style=\"background: #22314D; border-radius: 5px; padding: 38px 40px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 14px;\">START WITH A STRATEGY DOCUMENT, NOT A TACTICS LIST<\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.6; color: rgba(255,255,255,.82);\">Write the actual business problem in one sentence. Not \"we should do GEO,\" but something specific: <em>our brand is invisible in AI answers for our core category queries<\u002Fem>, or <em>qualified buyers get their questions answered without ever visiting us<\u002Fem>. Everything else is easier to prioritize once the real problem is named.<\u002Fp>\n        <p style=\"font-size: 17px; line-height: 1.6; color: rgba(255,255,255,.82); margin-top: 14px;\">Present it with <strong style=\"color:#fff;\">scenario planning<\u002Fstrong>, not a traffic forecast: conservative vs. aggressive resourcing, each tied to a business outcome like assisted conversions, with review points where investment can be paused or redirected. Revisit quarterly — a strategy written a year ago and never revisited is a tactics list wearing a strategy's clothing.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\n        <sc-for list=\"{{ strategyParts }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 26px 24px;\">\n            <div style=\"font-weight: 800; font-size: 26px; color: #FE6901; margin-bottom: 10px;\">{{ s.n }}<\u002Fdiv>\n            <h4 style=\"font-weight: 700; font-size: 18px; color: #22314D; margin-bottom: 9px;\">{{ s.title }}<\u002Fh4>\n            <p style=\"font-size: 15px; line-height: 1.48; color: #545C6E;\">{{ s.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 44px 60px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 26px; color: #22314D; margin-bottom: 18px;\">Run a baseline audit before changing anything<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ baseline }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 16px;\">\n              <span style=\"font-weight: 800; font-size: 20px; color: #FE6901; min-width: 26px;\">{{ b.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 3px;\">{{ b.q }}<\u002Fdiv>\n                <p style=\"font-size: 16px; line-height: 1.5; color: #545C6E;\">{{ b.a }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #545C6E; margin-top: 16px;\">Re-run it quarterly. That's what turns a baseline into a trend line.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 26px; color: #22314D; margin-bottom: 18px;\">Find what customers actually ask AI<\u002Fh3>\n        <p style=\"font-size: 16.5px; line-height: 1.6; color: #3E4658; margin-bottom: 14px;\">Don't guess the questions. Three rules keep prompt research honest: keep prompts <strong>brand-neutral<\u002Fstrong> (no company names), avoid direct \"X vs. Y\" comparisons, and focus on <strong>mid-to-bottom funnel<\u002Fstrong> questions from people already evaluating options. Mix short keyword-like phrasing with longer natural-language questions — people type both.<\u002Fp>\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .1em; color: #22314D; margin: 20px 0 12px;\">WHERE TO FIND THEM<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n          <sc-for list=\"{{ sources2 }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; gap: 12px; align-items: baseline; padding-bottom: 9px; border-bottom: 1px solid #E4DFD4;\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #FE6901; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.45; color: #3E4658;\"><strong style=\"color:#22314D;\">{{ s.name }}<\u002Fstrong> — {{ s.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 38px; background: #22314D; border-radius: 5px; padding: 32px 40px;\">\n      <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 8px;\">GSC QUERY FILTER — ISOLATE REAL QUESTIONS<\u002Fdiv>\n      <code style=\"font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14.5px; line-height: 1.5; color: #A9D8FF; word-break: break-word; display: block;\">^(how|who|what|where|when|why|which|can|could|do|does|did|is|are|was|were|should|would|will|may|might)\\b<\u002Fcode>\n      <p style=\"font-size: 15px; color: rgba(255,255,255,.66); margin-top: 12px;\">Paste into Search Console's query filter to surface question-based phrasing — close cousins of what the same person types into an AI tool.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 38px;\">\n      <sc-for list=\"{{ lenses }}\" as=\"l\" hint-placeholder-count=\"2\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 26px 30px;\">\n          <h4 style=\"font-weight: 700; font-size: 18px; color: #22314D; margin-bottom: 10px;\">{{ l.title }}<\u002Fh4>\n          <p style=\"font-size: 15.5px; line-height: 1.5; color: #4A5265;\">{{ l.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; background: #22314D; border-radius: 5px; overflow: hidden;\">\n      <div style=\"padding: 28px 34px;\">\n        <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #6FE0A0; margin-bottom: 15px;\">KEEP A PROMPT IF IT…<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ qualityKeep }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 11px; align-items: baseline;\"><span style=\"color: #6FE0A0; font-weight: 700;\">✓<\u002Fspan><span style=\"font-size: 15.5px; line-height: 1.4; color: rgba(255,255,255,.82);\">{{ q }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 28px 34px; border-left: 1px solid rgba(255,255,255,.12);\">\n        <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 15px;\">CUT IT IF IT…<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ qualityCut }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 11px; align-items: baseline;\"><span style=\"color: #FE6901; font-weight: 700;\">×<\u002Fspan><span style=\"font-size: 15.5px; line-height: 1.4; color: rgba(255,255,255,.82);\">{{ q }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-weight: 800; font-size: 26px; color: #22314D; margin: 44px 0 6px;\">Real prompts vs. estimated prompts<\u002Fh3>\n    <p style=\"font-size: 16.5px; line-height: 1.55; color: #545C6E; max-width: 1000px; margin-bottom: 18px;\">One analysis compared real ChatGPT prompts collected through market surveys against prompts estimated from keyword and search-console data. The gaps were larger than most teams would guess.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n      <sc-for list=\"{{ promptStats }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 24px 24px 26px;\">\n          <div style=\"font-weight: 800; font-size: 40px; color: #FE6901; line-height: 1;\">{{ p.stat }}<\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.42; color: #545C6E; margin-top: 10px;\">{{ p.label }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-style: italic; font-size: 15px; color: #6A7284; margin-top: 14px;\">Estimated prompts skew toward commercial \"best of\" phrasing. Real prompts skew exploratory, personal, and problem-first — a strategy built only on estimated prompts underweights the content real users are actually typing for.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-top: 30px;\">\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 24px 32px;\">\n        <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 8px;\">TWO NAMED, CHECKABLE SOURCES<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #3E4658;\"><strong>NBER<\u002Fstrong> (with OpenAI usage data): practical guidance and information-seeking are among the most common ChatGPT use cases, out of a reported ~2 billion searches run on the platform daily. <strong>Semrush:<\u002Fstrong> prompts averaged 4.2 words with web search active vs. 23 words without — some without web search ran over 2,700 words.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 24px 32px;\">\n        <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 8px;\">THE BRAND-ANCHOR CAVEAT<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #22314D;\">Ben Moore (Discovered Labs) found across five audited B2B SaaS prompt sets that naming the brand in a prompt inflated apparent visibility to <strong>10.8%<\u002Fstrong>, against <strong>1.9%<\u002Fstrong> for the same question asked brand-neutral. Run both. Treat the neutral prompts as the honest baseline.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 3 ============ -->\n  <section data-screen-label=\"Part 3 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">3<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART THREE<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">On-Page<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What to fix on your own site, and in what order.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3A: RETRIEVAL -->\n  <section data-screen-label=\"Part 3 - Retrieval\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 30px; color: #22314D; line-height: 1.1; margin-bottom: 20px;\">How AI search actually retrieves a page<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>Louise Linehan<\u002Fstrong> (Ahrefs, reviewed by Ryan Law) explains that most AI search tools use <strong>retrieval augmented generation<\u002Fstrong> (RAG): rather than answering purely from training data, the system runs a live search, retrieves pages, and feeds them to the model as it generates. Getting into training data isn't something a business can control. Getting into the retrieval results is — in Linehan's words, \"in many ways, an extension of SEO.\"<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\">Per Dan Petrovic's research, once candidate pages are collected, title, meta description, and URL help determine which get read in full and cited — and shortlisted sources tend to be selected for <em>relevance, authority, recency, and diversity of perspective<\u002Fem>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 36px 40px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 20px;\">THE THREE-STEP RETRIEVAL PROCESS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <sc-for list=\"{{ ragSteps }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 16px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 15px; color: #22314D; background: #FE6901; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ r.n }}<\u002Fspan>\n              <p style=\"font-size: 16.5px; line-height: 1.5; color: rgba(255,255,255,.82);\">{{ r.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ retrievalFindings }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 30px 30px 32px;\">\n          <div style=\"font-weight: 800; font-size: 42px; color: #FE6901; line-height: 1; margin-bottom: 14px;\">{{ f.stat }}<\u002Fdiv>\n          <h4 style=\"font-weight: 700; font-size: 19px; color: #22314D; margin-bottom: 10px; text-wrap: pretty;\">{{ f.title }}<\u002Fh4>\n          <p style=\"font-size: 15.5px; line-height: 1.5; color: #545C6E;\">{{ f.body }}<\u002Fp>\n          <div style=\"font-weight: 700; font-size: 12px; letter-spacing: .05em; color: #9AA0AC; margin-top: 12px;\">{{ f.who }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 44px; align-items: start;\">\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">QUERY FAN-OUT<\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.6; color: #3E4658; margin-bottom: 14px;\"><strong>Despina Gavoyannis<\u002Fstrong> (Ahrefs): traditional search was one-to-one, then many-to-one. AI search is <strong>one-to-many<\u002Fstrong> — a single question expands into multiple sub-queries run in parallel and synthesized into one answer. Citing Mike King's (iPullRank) work on Google's patents, the fan-out follows recognizable patterns:<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;\">\n          <sc-for list=\"{{ fanoutPatterns }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <span style=\"font-weight: 600; font-size: 14px; color: #22314D; background: #F5F2EC; border: 1px solid #E4DFD4; padding: 7px 14px; border-radius: 30px;\">{{ p }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #545C6E;\">Ranking for one exact keyword is no longer enough — the system scores your content against dozens of sub-queries you never targeted. The fix isn't writing content for literal fan-out phrases (they're synthetic and mostly zero-volume). It's mapping the recurring patterns in your category, auditing content against them, and prioritizing the gaps that align with real business goals.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 14px;\">REDDIT IS ENTERING THE FAN-OUT<\u002Fdiv>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: rgba(255,255,255,.82); margin-bottom: 14px;\">A researcher updating a fan-out study reports ChatGPT has begun running dedicated Reddit searches as part of its fan-out, including <code style=\"font-family: ui-monospace, Menlo, monospace; color:#A9D8FF;\">site:<\u002Fcode>-restricted searches against specific subreddits.<\u002Fp>\n        <div style=\"display: flex; gap: 28px; margin-bottom: 14px;\">\n          <div><div style=\"font-weight: 800; font-size: 32px; color: #FE6901;\">0.1%<\u002Fdiv><div style=\"font-size: 14px; color: rgba(255,255,255,.6); margin-top: 2px;\">of ChatGPT fan-outs<br>(17 of ~17,000)<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-weight: 800; font-size: 32px; color: #FE6901;\">1.42%<\u002Fdiv><div style=\"font-size: 14px; color: rgba(255,255,255,.6); margin-top: 2px;\">of Gemini fan-outs<br>(same dataset)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.62);\">A single small unverified sample — treat as a leading indicator, not a settled statistic. But set against Reddit's 21% citation share in AI Overviews (Part 4), it points the same direction: Reddit is a real off-page channel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3B: STRUCTURE -->\n  <section data-screen-label=\"Part 3 - Structure\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 46px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 30px; color: #22314D; line-height: 1.1; margin-bottom: 20px;\">How AI systems actually read a page<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>Carolyn Shelby<\u002Fstrong> (SEJ, April 2025): structured <em>data<\u002Fem> (schema, JSON-LD) is optional for LLMs. Structured <em>writing<\u002Fem> is not. Crawlers rely on markup and links; LLMs tokenize the page and use attention to judge whether it expresses a clear idea and answers a question directly.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\">A keyword-rich page with full schema can still fail to appear in an AI summary, while a clear, well-formatted post with zero structured data gets quoted. Schema reinforces good structure — it doesn't rescue bad structure. And retrieval still depends on <strong>literal phrasing<\u002Fstrong>: Shelby's own well-structured article never surfaced in her research because every competing piece used \"LLM\" in the title where hers said \"AI Search.\" Write the words your customers actually type.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 34px;\">\n        <div style=\"font-weight: 700; font-size: 15px; letter-spacing: .1em; color: #FE6901; margin-bottom: 18px;\">FIVE STRUCTURAL PATTERNS AI FAVORS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ patterns }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 15px; color: #fff; background: #22314D; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ p.n }}<\u002Fspan>\n              <span style=\"font-size: 16.5px; line-height: 1.45; color: #3E4658;\">{{ p.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #22314D; border-radius: 5px; padding: 44px 50px; margin-bottom: 46px;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;\">\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #fff;\">Writing in passage-first blocks<\u002Fh3>\n        <span style=\"font-weight: 700; font-size: 12px; letter-spacing: .14em; color: #FE6901;\">HECTO'S CONTENT FRAMEWORK<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 17px; line-height: 1.6; color: rgba(255,255,255,.7); max-width: 900px; margin-bottom: 28px;\">The research above explains why AI favors certain structures. This is how we actually write that way.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 32px;\">\n        <sc-for list=\"{{ passageFramework }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"border-top: 2px solid rgba(254,105,1,.4); padding-top: 16px;\">\n            <h4 style=\"font-weight: 700; font-size: 18px; color: #fff; margin-bottom: 8px;\">{{ p.title }}<\u002Fh4>\n            <p style=\"font-size: 15.5px; line-height: 1.55; color: rgba(255,255,255,.72);\">{{ p.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-weight: 800; font-size: 24px; color: #22314D; margin-bottom: 6px;\">The how-to, grouped by cadence<\u002Fdiv>\n    <p style=\"font-size: 16px; color: #545C6E; margin-bottom: 22px;\">Restated in our own words from the on-page checklist, and consistent with the research above.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ onpageTopics }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 30px 30px 32px;\">\n          <h4 style=\"font-weight: 800; font-size: 21px; color: #22314D; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #F0EBE0;\">{{ c.title }}<\u002Fh4>\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <sc-for list=\"{{ c.groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"display: inline-block; font-weight: 700; font-size: 11px; letter-spacing: .1em; color: #FE6901; background: #FFF3EA; border: 1px solid #FBD9BE; padding: 4px 11px; border-radius: 30px; margin-bottom: 12px;\">{{ g.tag }}<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                      <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #22314D; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n                      <span style=\"font-size: 14.5px; line-height: 1.42; color: #4A5265;\">{{ i }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 44px; align-items: start;\">\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">SEMANTIC HTML IS CRAWLABILITY WORK<\u002Fdiv>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: #3E4658; margin-bottom: 12px;\">Many AI crawlers snapshot a page and split it into ~200-word chunks. Clean semantic structure produces clean chunks; one giant undifferentiated <code style=\"font-family: ui-monospace, Menlo, monospace; font-size: 15px; color: #22314D;\">&lt;div&gt;<\u002Fcode> produces a jumbled one.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ semanticItems }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n              <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #FE6901; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n              <span style=\"font-size: 15.5px; line-height: 1.45; color: #4A5265;\">{{ s }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.5; color: #6A7284; margin-top: 14px;\">Fast diagnostic: open the page in Chrome DevTools' Accessibility panel. A clean tree of headings and named links is what an AI crawler sees. A flat, undifferentiated block is what \"AI can't read this page\" actually looks like.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 12px;\">HELP CENTER DOCS AS A GEO SURFACE<\u002Fdiv>\n        <p style=\"font-size: 16.5px; line-height: 1.58; color: #3E4658; margin-bottom: 12px;\">Landing pages are built to convert, not to go deep, so they can't answer a detailed question about an integration or a feature edge case. AI tools turn to the documentation instead — which is why, for B2B and technical products, help center content deserves the same structural treatment as marketing pages.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ helpCenter }}\" as=\"h\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n              <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #FE6901; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n              <span style=\"font-size: 15.5px; line-height: 1.45; color: #4A5265;\">{{ h }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; margin-top: 20px; align-items: start;\">\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 16px;\">AUTHOR IDENTITY<\u002Fdiv>\n        <p style=\"font-size: 16.5px; line-height: 1.55; color: rgba(255,255,255,.8); margin-bottom: 16px;\">Roger Montti (SEJ, July 2026) relayed John Mueller on two invented fixes — an \"llms-author.txt\" file and a \"Content-Signal\" header:<\u002Fp>\n        <blockquote style=\"font-style: italic; font-size: 18px; line-height: 1.5; color: #fff; border-left: 3px solid #FE6901; padding-left: 18px; margin-bottom: 16px;\">\"Google doesn't use llms.txt or llms-author.txt… it has no effects whatsoever for any crawler or llm.\"<\u002Fblockquote>\n        <p style=\"font-size: 16.5px; line-height: 1.55; color: rgba(255,255,255,.8);\">The real fix for a name-collision problem isn't a made-up file — it's real Author schema, a linked bio page, and a body of attributable work.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 6px;\">CONTENT ARCHITECTURE FOR SCALE &amp; PERSONALIZATION<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 12px;\">\n          <sc-for list=\"{{ arch }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid #EBE6DB; padding-bottom: 14px;\">\n              <div style=\"font-weight: 700; font-size: 16px; color: #22314D; margin-bottom: 3px;\">{{ a.name }}<\u002Fdiv>\n              <p style=\"font-size: 15px; line-height: 1.48; color: #545C6E;\">{{ a.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3C: SCALING TRAP + RECOVERY -->\n  <section data-screen-label=\"Part 3 - Scaling trap\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"border-left: 4px solid #FE6901; background: #fff; border-radius: 0 5px 5px 0; padding: 34px 40px;\">\n      <div style=\"font-weight: 800; font-size: 24px; color: #22314D; margin-bottom: 12px;\">⚠&nbsp; The scaling trap<\u002Fdiv>\n      <p style=\"font-size: 17.5px; line-height: 1.6; color: #3E4658; margin-bottom: 10px;\">Scaling AI-generated content is the most common strategy <em>and<\u002Fem> the most common failure. Google began issuing <strong>manual actions for scaled content abuse<\u002Fstrong> in June 2025 (Pedro Dias), and its Quality Rater Guidelines now apply the lowest rating to low-effort AI content regardless of how it was produced (John Mueller). The \"Mt. AI effect\": a freshness spike, then a cliff when quality assessment catches up (Glenn Gabe / Dan Taylor).<\u002Fp>\n      <p style=\"font-size: 17.5px; line-height: 1.6; color: #3E4658;\"><strong>The fix:<\u002Fstrong> wrap AI tools around subject-matter experts and editors rather than replacing them. Danny Sullivan's distinction — commodity content (anything an AI could produce from public info) vs. non-commodity content (requires real experience or an informed opinion) — is the actual competitive advantage going into the AI era. And match the model to the task: reasoning-strong models for data-heavy and technical work, writing-tuned models for blog and marketing copy. Never publish without editorial review.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 22px 0 18px;\">\n        <sc-for list=\"{{ scalingQuotes }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"background: #F7F5F1; border: 1px solid #EBE6DB; border-radius: 5px; padding: 18px 20px;\">\n            <p style=\"font-style: italic; font-size: 14.5px; line-height: 1.45; color: #3E4658; margin-bottom: 8px;\">“{{ q.quote }}”<\u002Fp>\n            <div style=\"font-weight: 700; font-size: 12px; letter-spacing: .04em; color: #FE6901;\">{{ q.who }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size: 15.5px; line-height: 1.55; color: #545C6E;\"><strong style=\"color:#22314D;\">Enforcement is already here.<\u002Fstrong> Perplexity once confidently reported a \"September 2025 Perspective Core Algorithm Update\" that never happened, citing AI-generated agency blogs that had hallucinated it (Lily Ray's test). Google's spam policies now explicitly cover manipulating generative AI responses — including buying or altering citations (Matt G. Southern, June 2026).<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; margin-top: 48px; align-items: start;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Diagnosing a site-quality problem<\u002Fh3>\n        <p style=\"font-size: 17px; line-height: 1.6; color: #3E4658; margin-bottom: 14px;\">Google's Page Indexing Report distinguishes <em>discovered, currently not indexed<\u002Fem> (known but not crawled) from <em>crawled, currently not indexed<\u002Fem> (crawled and rejected). Per Martin Splitt and John Mueller, via Roger Montti, the second isn't always a quality problem — but across a large pattern of pages with no technical explanation, it is one:<\u002Fp>\n        <blockquote style=\"font-style: italic; font-size: 17px; line-height: 1.5; color: #22314D; border-left: 3px solid #FE6901; padding-left: 18px; margin-bottom: 14px;\">\"If our systems are seriously worried about the quality of the website, they will reduce the number of pages at the index.\"<\u002Fblockquote>\n        <p style=\"font-size: 17px; line-height: 1.6; color: #3E4658;\">Mueller's other point: quality isn't only the text. A page with genuinely unique writing can still fail if that text sits behind ads, interstitials, or filler, because Google considers \"the full experience on a page because that's what users see.\"<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">What actually helps a site recover<\u002Fh3>\n        <p style=\"font-size: 16.5px; line-height: 1.55; color: #545C6E; margin-bottom: 18px;\">Across sites that have successfully recovered from a core update, the pattern is consistent — and it rarely starts with a technical fix.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ recovery }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 20px 24px; display: flex; gap: 16px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 13px; letter-spacing: .06em; color: #fff; background: #FE6901; padding: 5px 12px; border-radius: 30px; flex-shrink: 0;\">{{ r.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 3px;\">{{ r.title }}<\u002Fdiv>\n                <p style=\"font-size: 15.5px; line-height: 1.48; color: #545C6E;\">{{ r.desc }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #22314D; margin-top: 16px;\"><strong>The single most useful question<\u002Fstrong> to ask about any key page: does it fully satisfy the intent for its target query, and can a user find a complete answer here without going elsewhere?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART 4 ============ -->\n  <section data-screen-label=\"Part 4 divider\" style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">4<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART FOUR<\u002Fdiv>\n      <h2 style=\"font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Off-Page<\u002Fh2>\n      <p style=\"font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What to fix beyond your own site.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 4 - Entity &amp; accuracy\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 46px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Entity consistency is the foundation<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\">If a business's name, address, or description varies even slightly across Google Business Profile, Apple Maps, Yelp, and Bing Places, AI systems can treat one business as several unrelated ones. Montserrat Cano calls this <strong>\"entity drift.\"<\u002Fstrong> Auditing every listing against one agreed-on version is the single highest-leverage fix for a multi-location business.<\u002Fp>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin: 30px 0 16px;\">Being mentioned &gt; being linked<\u002Fh3>\n        <p style=\"font-size: 18px; line-height: 1.64; color: #3E4658;\"><strong>Mordy Oberstein:<\u002Fstrong> LLMs synthesize the whole web into one answer, so <em>how<\u002Fem> a brand is talked about — where, by whom, how often — carries more weight than whether one specific page gets cited. Omniscient Digital's analysis of 23,000+ citations found owned content accounts for only ~23% of citations on branded queries. The other 77% is off-page.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 40px 42px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 20px;\">WHERE OFF-PAGE AUTHORITY LIVES<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <sc-for list=\"{{ offpage }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 18px;\">\n              <div style=\"font-weight: 700; font-size: 17px; color: #fff; margin-bottom: 4px;\">{{ o.name }}<\u002Fdiv>\n              <p style=\"font-size: 15.5px; line-height: 1.45; color: rgba(255,255,255,.68);\">{{ o.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 8px;\">AI is already telling customers things about your locations — and often they're wrong<\u002Fh3>\n    <p style=\"font-size: 17px; line-height: 1.6; color: #545C6E; max-width: 1060px; margin-bottom: 24px;\">Searchable tested ChatGPT, Gemini, and Perplexity against 165 London businesses using 13,365 questions, checked against Companies House records (via Matt G. Southern, SEJ, July 2026). There's no ranking report that flags this the way Search Console flags a traffic drop, so it has to be checked manually, on a recurring basis.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;\">\n      <sc-for list=\"{{ accuracyStats }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 26px 26px 28px;\">\n          <div style=\"font-weight: 800; font-size: 42px; color: #FE6901; line-height: 1;\">{{ a.stat }}<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.45; color: #545C6E; margin-top: 10px;\">{{ a.label }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 26px 34px; margin-bottom: 40px;\">\n      <p style=\"font-style: italic; font-size: 18px; line-height: 1.55; color: #22314D;\">\"For a smaller bricks-and-mortar retailer, if their online visibility mostly centres around its website and a Google Business listing, that's a relatively thin trail of information for AI systems to learn from and to represent in their answers.\"<\u002Fp>\n      <div style=\"font-weight: 700; font-size: 13px; letter-spacing: .06em; color: #FE6901; margin-top: 10px;\">CHRIS DONNELLY, CO-FOUNDER, SEARCHABLE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: start;\">\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 16px;\">THE LOCATION-ACCURACY AUDIT PROCESS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ locationAudit }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 14px; color: #fff; background: #22314D; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ l.n }}<\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.48; color: #3E4658;\">{{ l.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 16px;\">CONTEXT BEFORE YOU SET CLIENT EXPECTATIONS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ localContext }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 16px; align-items: baseline;\">\n              <span style=\"font-weight: 800; font-size: 26px; color: #FE6901; min-width: 78px;\">{{ c.stat }}<\u002Fspan>\n              <span style=\"font-size: 15.5px; line-height: 1.45; color: rgba(255,255,255,.76);\">{{ c.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Part 4 - Local &amp; GBP\" style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 46px;\">\n      <div>\n        <h3 style=\"font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Building location pages AI will actually cite<\u002Fh3>\n        <p style=\"font-size: 17.5px; line-height: 1.62; color: #3E4658; margin-bottom: 14px;\"><strong>Adam Heitzman<\u002Fstrong> (SEJ): the cookie-cutter location page — same template, generic copy, city name swapped — fails because AI systems look for <strong>fact density, not word count<\u002Fstrong>. Publishing more content without improving structure actively works against you. Volume isn't the lever. Structure is.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 20px;\">\n          <sc-for list=\"{{ locationPages }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 22px 26px;\">\n              <div style=\"font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 6px;\">{{ l.title }}<\u002Fdiv>\n              <p style=\"font-size: 15.5px; line-height: 1.5; color: #545C6E;\">{{ l.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>
