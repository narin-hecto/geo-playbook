, body: 'ChatGPT isn\\u2019t built to drive citations \\u2014 it\\u2019s built to answer and keep the conversation going. How your brand is talked about carries weight independent of whether your site ranks (Mordy Oberstein).' },\n        { n: '02', title: 'Run a brand sentiment audit', body: 'Ask an LLM what it says about you, competitors, and the category. Asking \"is Gatorade a great drink\" vs. \"is Powerade a good drink\" can surface a subtle framing gap. LLMs skew neutral-to-positive, so the signal isn\\u2019t negativity \\u2014 it\\u2019s the gap between confident praise and hedged praise.' },\n        { n: '03', title: 'Brand identity is the foundation', body: 'A brand without a clear, focused identity produces tangential content that dilutes exactly the signal AI and audiences use to decide whether it\\u2019s worth mentioning.' }\n      ],\n      cadence: [\n        { when: 'DAILY', what: 'Check citations, mentions, sentiment, and crawl frequency for unusual patterns; triage critical site changes before they compound.' },\n        { when: 'WEEKLY', what: 'Track share-of-voice across AI engines; review AI-answer ownership for target prompts; audit recent changes for schema/canonical/robots impact.' },\n        { when: 'MONTHLY', what: 'Analyze bot crawl patterns in server logs; identify under-crawled priority pages; benchmark vs. 3\\u20135 named competitors; circulate the AEO/GEO report.' },\n        { when: 'QUARTERLY', what: 'Correlate the full change log against performance shifts; refresh KPI targets; re-run the full Part 2 baseline audit.' }\n      ],\n      multipliers: [\n        { x: '~10\\u00d7', who: 'harder to earn a click from Google than a decade ago' },\n        { x: '~750\\u00d7', who: \"harder from OpenAI's products\" },\n        { x: '~30,000\\u00d7', who: \"harder from Anthropic's\" }\n      ],\n      lenses: [\n        { title: 'Lens 1 \\u2014 Who are the market players?', desc: 'Questions answered by naming a company: leading providers by general reputation, affordability, the customer segment served, region/locality, and trust or track record.' },\n        { title: 'Lens 2 \\u2014 What makes an option worth choosing?', desc: 'Questions answered by describing a quality without naming a brand: performance, support and reliability after the sale, price and contract flexibility, ease of use, and fit for a specific use case.' }\n      ],\n      qualityKeep: ['Sounds like a real human search', 'Leads an AI tool to name providers or describe a clear quality', 'Sits mid-to-bottom of the funnel', 'Is specific to one category', 'Mixes short keyword phrasing with longer natural-language questions'],\n      qualityCut: ['Names a brand \\u2014 yours or a competitor\\u2019s', 'Directly compares two named competitors (\"X vs. Y\")', 'Reads like an article headline', 'Is a near-duplicate of one already on the list'],\n      onpageTopics: [\n        { title: 'Content structure', groups: [\n          { tag: 'For every piece', items: ['Answer the primary question in the first 1\\u20132 sentences of a section', 'Question-based headings that mirror how customers actually search (from Part 2)', 'Lead each section with a self-contained answer that still makes sense quoted alone', 'Include a summary / key-takeaways block near the top', 'Match format to content: tables for comparisons, numbered lists for steps, prose for explanation', 'Define jargon on first use', 'One original element per page \\u2014 proprietary data, a quote, or a POV; cite original sources, not aggregators'] },\n          { tag: 'Monthly', items: ['Identify which pages are actually getting cited in AI answers; note what they share', 'Cross-reference against strong-traffic pages with zero AI citations \\u2014 that gap is usually structural'] },\n          { tag: 'Quarterly', items: ['Refresh anything published in the last 3\\u20136 months with current data and examples \\u2014 recency is a trust signal'] } ] },\n        { title: 'Crawlability', groups: [\n          { tag: 'One-time setup', items: ['Document an explicit AI-bot allow/block strategy in writing, with the reasoning', 'Configure robots.txt to name major AI bots explicitly, not a generic wildcard', 'Establish a topic-cluster architecture with pillar pages', 'Implement canonical tags across every indexable page'] },\n          { tag: 'As content ships', items: ['Link new content to and from its related pillar page', 'Use anchor text that describes the linked topic, not generic phrases', 'Add newly published pages to the XML sitemap immediately'] },\n          { tag: 'Monthly & quarterly', items: ['Review server logs for AI-bot crawl activity; investigate unexpected blocks or drops', 'Audit for orphan pages \\u2014 link them in or deprecate', 'Audit canonical implementation site-wide (quarterly)', 'Update robots.txt and reassess the allow/block strategy against the current bot landscape'] } ] },\n        { title: 'Technical health & authority', groups: [\n          { tag: 'One-time setup', items: ['Implement JSON-LD schema across every page template', 'Organization schema site-wide with consistent NAP \\u2014 the top fix for multi-location businesses', 'Person schema on every author bio, with sameAs links to verified profiles', 'Document which schema types apply to which templates'] },\n          { tag: 'Ongoing', items: ['Validate schema with the Rich Results Test before publishing, not after', 'Confirm critical content loads in HTML, not client-side JS', 'Spot-check new pages with JavaScript disabled; flag gaps to engineering'] },\n          { tag: 'Monthly & quarterly', items: ['Run a site-wide schema audit for errors and mismatches', 'Review Core Web Vitals across key content', 'Review schema.org for new relevant types'] } ] }\n      ],\n      arch: [\n        { name: 'The failure pattern (Gabriel Dillon)', desc: 'A team requests a tailored page and three weeks later gets a duplicated page with hardcoded copy, while the email stream stays generic. One dev sprint, exactly one surface.' },\n        { name: 'The diagnosis', desc: 'When a CMS treats content as monolithic pages, personalization can only happen at the page level. Real personalization needs content broken into components assembled by context \\u2014 which most page-based platforms aren\\u2019t built to do.' },\n        { name: 'Where to start', desc: 'Paid landing pages (the audience signal is already in the ad) and the new-vs-returning split on high-traffic organic pages. Run it as an ongoing capability with a named owner \\u2014 not a one-time project.' },\n        { name: 'Multi-location: entity drift (Montserrat Cano)', desc: 'Regional pages get mistaken for separate brands when schema and naming aren\\u2019t consistent. Fixes: reinforce site structure, schema, internal linking, hreflang; organize around topic clusters, not keyword lists.' }\n      ],\n      scalingQuotes: [\n        { who: 'Aleyda Sol\\u00eds', quote: 'A personalized editorial and optimization workflow is required to ensure quality, originality, and expertise \\u2014 exactly what AI platforms are likely to cite.' },\n        { who: 'Eli Schwartz', quote: 'Leaders are somewhat skeptical about mass AI content, but afraid of being left behind if they don\\u2019t do this.' },\n        { who: 'Lily Ray', quote: 'Just because it\\u2019s easy doesn\\u2019t mean it\\u2019s a good idea.' },\n        { who: 'Shushrita M.', quote: 'A sudden decline does not automatically mean your content is bad. Recovery starts with diagnosis, not panic.' }\n      ],\n      offpageCadence: [\n        { tag: 'One-time setup', items: ['Build a complete About page with Organization schema (establishes the entity off-page sources reference)', 'Add visible, genuinely-earned trust signals: certifications, awards, press mentions, client logos'] },\n        { tag: 'Ongoing', items: ['Link out to 2\\u20133 authoritative external sources in longform \\u2014 signals you\\u2019re engaging with the category, not just repeating it'] },\n        { tag: 'Monthly & quarterly', items: ['Audit new content for outbound link quality and freshness', 'Audit brand sentiment and entity consistency across third-party sites', 'Review trust signals for accuracy \\u2014 an expired certification does more harm than good', 'Run an entity-consistency audit across every owned property and directory listing, not just the website'] }\n      ],\n      sources: [\n        { n: '1', author: 'Conductor', title: 'The On-Page AEO Checklist', pub: 'Q1 2026.' },\n        { n: '2', author: 'Mordy Oberstein', title: '\"Ask An SEO: Do I Need To Rethink My Content Strategy For LLMs?\"', pub: 'Search Engine Journal, Nov 11, 2025.' },\n        { n: '3', author: 'Matthew Prince', title: '\"Content Independence Day: no AI crawl without compensation!\"', pub: 'Cloudflare Blog, Jul 1, 2025.' },\n        { n: '4', author: 'Alex Moss', title: '\"From Search To Discovery: Why SEO Must Evolve Beyond The SERP\"', pub: 'Search Engine Journal, May 19, 2025.' },\n        { n: '5', author: 'Roger Montti', title: '\"Google Answers Question About LLMs-Author.txt For SEO\"', pub: 'Search Engine Journal, Jul 6, 2026.' },\n        { n: '6', author: 'Matt G. Southern', title: '\"Google Spam Update Rolls Out, AI Manipulation In Scope \\u2014 SEO Pulse\"', pub: 'Search Engine Journal, Jun 26, 2026.' },\n        { n: '7', author: 'Carolyn Shelby', title: '\"How LLMs Interpret Content: How To Structure Information For AI Search\"', pub: 'Search Engine Journal, Apr 28, 2025.' },\n        { n: '8', author: 'Shelley Walsh, Gabriel Dillon & Montserrat Cano', title: '\"After The AI Content Flood: Why Personalized Experiences Need Better Content Architecture\"', pub: 'Search Engine Journal, 2026.' },\n        { n: '9', author: 'National Bureau of Economic Research', title: 'Working paper on ChatGPT usage patterns (with OpenAI)', pub: 'cited in Part 2.' },\n        { n: '10', author: 'Semrush', title: 'Research on ChatGPT prompt length with/without web search', pub: 'cited in Part 2.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
