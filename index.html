er your site ranks (Mordy Oberstein).' },\n        { n: '02', title: 'Run a brand sentiment audit', body: 'Ask an LLM what it says about you, competitors, and the category. Asking \"is Gatorade a great drink\" vs. \"is Powerade a good drink\" can surface a subtle framing gap. LLMs skew neutral-to-positive, so the signal isn\\u2019t negativity \\u2014 it\\u2019s the gap between confident praise and hedged praise.' },\n        { n: '03', title: 'Brand identity is the foundation', body: 'A brand without a clear, focused identity produces tangential content that dilutes exactly the signal AI and audiences use to decide whether it\\u2019s worth mentioning.' }\n      ],\n      paidStats: [\n        { stat: '+10%', label: 'higher ROAS and 12% higher sales effectiveness when AI-powered Demand Gen was added to Search and Performance Max', src: 'NIELSEN MMM META-ANALYSIS \\u2014 1.1M CAMPAIGNS, 104 WEEKS' },\n        { stat: '+86%', label: 'higher incremental long-term ROAS for YouTube than paid social', src: 'CIRCANA \\u2014 40 MMMs ACROSS 10 U.S. CPG BRANDS' },\n        { stat: '49%', label: 'of incremental sales driven by advertising creative \\u2014 still the single largest driver of effectiveness', src: 'NCSOLUTIONS' }\n      ],\n      paidCases: [\n        { brand: 'DR. MARTENS', result: '+16% revenue', desc: 'Shifted Performance Max to feed first-party margin data directly into the campaign, optimizing for actual product profitability rather than easy conversions.' },\n        { brand: 'LUFTHANSA GROUP', result: '+16% / +24%', desc: 'Conversion rate and ROAS respectively, from meeting customers earlier in their research process.' },\n        { brand: 'GENERAL MOTORS', result: '3\\u00d7 ROI', desc: 'On YouTube specifically, pairing premium placements with Demand Gen across the full consumer journey.' }\n      ],\n      conversionQs: [\n        { n: '01', q: 'Are you the recommended solution throughout the journey?', body: 'A customer might hear a business named favorably three separate times at three stages of research before ever visiting the site. None show up as a conversion event; all three shaped the outcome.', practical: 'PRACTICAL VERSION: RUN THE PART 5 SENTIMENT AUDIT REGULARLY, ACROSS ALL THREE STAGES' },\n        { n: '02', q: 'Do you show contextual relevance that makes users feel understood?', body: 'A generic page answering a generic version of the question converts differently than one reflecting the specific situation a user described.', practical: 'PRACTICAL VERSION: IS THE PART 3 CONTENT ARCHITECTURE BUILT, OR STILL A BACKLOG ITEM?' },\n        { n: '03', q: 'Can you track influence through actual conversion paths?', body: 'A lack of referral traffic is not a lack of influence. This is the attribution blind spot, stated as the question a client will eventually ask.', practical: 'PRACTICAL VERSION: BRANDED-SEARCH AND SHARE-OF-VOICE TRACKING IN A RECURRING REPORT' }\n      ],\n      cadence: [\n        { when: 'DAILY', what: 'Check citations, mentions, sentiment, and crawl frequency for unusual patterns; triage critical site changes before they compound.' },\n        { when: 'WEEKLY', what: 'Track share-of-voice across AI engines; review AI-answer ownership for target prompts; audit recent changes for schema/canonical/robots impact.' },\n        { when: 'MONTHLY', what: 'Analyze bot crawl patterns in server logs; identify under-crawled priority pages; benchmark vs. 3\\u20135 named competitors; circulate the GEO/AEO report.' },\n        { when: 'QUARTERLY', what: 'Correlate the full change log against performance shifts; refresh KPI targets; re-run the full Part 2 baseline audit.' }\n      ],\n      moorechecks: [\n        { name: 'Coverage check', desc: 'Does the prompt set actually span the categories and funnel stages a real customer would ask about, or does it cluster around a handful of easy, brand-favorable phrasings?' },\n        { name: 'Confound check', desc: 'Are the prompts accidentally correlated with something other than what they claim to measure \\u2014 the same problem fan-out research flags for content coverage?' },\n        { name: 'Brand-anchor check', desc: 'Naming a brand in the prompt inflated apparent visibility to 10.8% versus 1.9% unanchored. A methodology that only asks branded questions measures brand recall, not market visibility.' }\n      ],\n      funnelStages: [\n        { stage: 'Discovery', split: 'AI 35.0% vs. search 13.6%' },\n        { stage: 'Active comparison', split: 'AI 30.0% vs. search 24.3%' },\n        { stage: 'Ready to buy', split: 'Search catches back up' }\n      ],\n      multipliers: [\n        { x: '~10\\u00d7', who: 'harder to earn a click from Google than a decade ago' },\n        { x: '~750\\u00d7', who: \"harder from OpenAI's products\" },\n        { x: '~30,000\\u00d7', who: \"harder from Anthropic's\" }\n      ],\n      testRules: [\n        { n: '1', text: 'Which pages, locations, or campaigns are in the test group versus the control' },\n        { n: '2', text: 'Exactly what\\u2019s changing' },\n        { n: '3', text: 'How long the test runs before being read' },\n        { n: '4', text: 'The single metric that decides whether it worked' }\n      ],\n      experiments: [\n        { title: 'On-page structure', items: [\n          'Rewrite generic headings (\"Overview,\" \"Benefits\") into entity-specific, question-form headings on one page set; track AI Overview and citation appearance against an untouched set over 30 days.',\n          'Add a 2\\u20133 sentence key-takeaways block under the headline on half a page set; compare citation rate and time-on-page.',\n          'Embed jump links inline where each sub-topic appears rather than only in a top-of-page TOC; compare which sections get cited.',\n          'Add FAQPage schema to pages that already have FAQ content but no markup; compare against a matched set with no schema \\u2014 a direct test of Shelby\\u2019s claim.',\n          'Add named-author bios with Person schema to currently anonymous posts; track whether they appear in the \"who\\u2019s cited\" audits next quarter.',\n          'Move citations from a bottom reference list to inline placement next to the claim; compare quotation behavior.'\n        ] },\n        { title: 'Technical', items: [\n          'Filter server logs to AI-bot user agents (GPTBot, ClaudeBot, PerplexityBot), find the slowest pages by TTFB, fix hosting or caching on half, and compare crawl frequency and citation pickup.',\n          'Rebuild one page template still built as a single generic container with proper semantic sectioning; run old and new side by side on comparable pages.',\n          'Server-render main content where it currently loads via client-side JS on a subset of pages; check whether those specifically start appearing in AI answers.',\n          'If all AI bots are currently blocked, test explicitly allowing GPTBot and PerplexityBot on one subdirectory and watch branded search and referral patterns for that section only.'\n        ] },\n        { title: 'Local & off-page', items: [\n          'Standardize NAP across GBP, Apple Maps, Yelp, and Bing Places for the messiest locations only; re-run the standard AI question list 30 days later and compare error counts against unfixed locations.',\n          'For a subset of locations, commit to review responses naming the specific service, location, and outcome for 60 days; compare AI-answer sentiment and specificity against a generic-response control.',\n          'From the \"cites competitors but not you\" list, pitch a correction or contribution to a handful of sites; track whether AI answers start citing you on those topics within a quarter.',\n          'Build one properly sourced entry on a reference site where you currently have zero presence; compare category-level citation share before and after.'\n        ] },\n        { title: 'Content strategy', items: [\n          'Map the likely fan-out sub-queries for one topic cluster, identify the 2\\u20133 angles not currently covered, publish for those specifically, and check for citation pickup on those exact angles.',\n          'Produce the same brief through a reasoning-oriented AI workflow and a writing-oriented one, human-edit both to the same bar, and compare engagement and citation over time.',\n          'Refresh stats, examples, and the visible \"last updated\" date on half of a set of declining 6\\u201312-month-old pages; compare recrawl frequency and traffic recovery.'\n        ] },\n        { title: 'Paid media', items: [\n          'Feed margin or CRM audience data into one Performance Max campaign and run a matched campaign without it \\u2014 compare ROAS and sales effectiveness, not conversion volume alone.',\n          'Add Demand Gen to a Search or Performance Max campaign currently running alone, holding budget constant, and compare ROAS lift.'\n        ] },\n        { title: 'Measurement', items: [\n          'Run a PR or content push aimed specifically at AI visibility with no paid promotion behind it, then track branded search query volume weekly for 60 days instead of direct traffic \\u2014 to see whether that proxy is sensitive enough to register the effort at all.',\n          'Read the result against the credible-interval caveat in Part 7: a single week\\u2019s swing isn\\u2019t the same thing as a confirmed trend.'\n        ] }\n      ],\n      automation: [\n        { n: '01', title: 'Nightly full-site crawl', desc: 'Split by section across agents, each hunting broken links, redirect chains, and orphan pages \\u2014 one merged report by morning.', part: 'PART 3' },\n        { n: '02', title: 'Competitor keyword-gap loop', desc: 'One agent per named competitor pulling their ranking pages, merged into a list of queries you\\u2019re invisible for.', part: 'PART 2' },\n        { n: '03', title: 'Server-log analysis', desc: 'Split raw logs across agents to map where AI and search crawlers actually go \\u2014 reliably different pages than a team would guess.', part: 'PART 7' },\n        { n: '04', title: 'Cannibalization loop', desc: 'One agent per keyword cluster identifying pages competing for the same query, recommending keep vs. consolidate.', part: 'PART 3' },\n        { n: '05', title: 'Title & meta rewrite loop', desc: 'Pull GSC click-through data page by page, flag underperformers, draft new titles in bulk.', part: 'PART 3' },\n        { n: '06', title: 'Schema generation loop', desc: 'One agent per page type generating and validating structured data \\u2014 turning a developer ticket into a review step.', part: 'PART 3' },\n        { n: '07', title: 'Internal-linking loop', desc: 'Map every link on the site to surface high-value pages with no internal links pointing at them.', part: 'PART 3' },\n        { n: '08', title: 'Core Web Vitals watch', desc: 'Monitor every deploy and flag an LCP regression the same day it ships, not weeks later in an audit.', part: 'PART 3' },\n        { n: '09', title: 'Content-decay loop', desc: 'One agent per declining page rewriting it against whatever currently outranks it \\u2014 an automated freshness refresh.', part: 'PART 3' },\n        { n: '10', title: 'Daily rank tracking', desc: 'Pull ranking positions into a shared sheet each morning, covering the same ground as a paid subscription.', part: 'PART 7' }\n      ],\n      sources: [\n        { n: '1', author: 'Conductor', title: 'The On-Page AEO Checklist', pub: 'Q1 2026.' },\n        { n: '2', author: 'Mordy Oberstein', title: '\"Ask An SEO: Do I Need To Rethink My Content Strategy For LLMs?\"', pub: 'Search Engine Journal, Nov 11, 2025.' },\n        { n: '3', author: 'Matthew Prince', title: '\"Content Independence Day: no AI crawl without compensation!\"', pub: 'Cloudflare Blog, Jul 1, 2025.' },\n        { n: '4', author: 'Alex Moss', title: '\"From Search To Discovery: Why SEO Must Evolve Beyond The SERP\"', pub: 'Search Engine Journal, May 19, 2025.' },\n        { n: '5', author: 'Roger Montti', title: '\"Google Answers Question About LLMs-Author.txt For SEO\"', pub: 'Search Engine Journal, Jul 6, 2026.' },\n        { n: '6', author: 'Matt G. Southern', title: '\"Google Spam Update Rolls Out, AI Manipulation In Scope \\u2014 SEO Pulse\"', pub: 'Search Engine Journal, Jun 26, 2026.' },\n        { n: '7', author: 'Carolyn Shelby', title: '\"How LLMs Interpret Content: How To Structure Information For AI Search\"', pub: 'Search Engine Journal, Apr 28, 2025.' },\n        { n: '8', author: 'Walsh, Dillon & Cano', title: '\"After The AI Content Flood: Why Personalized Experiences Need Better Content Architecture\"', pub: 'Search Engine Journal, 2026.' },\n        { n: '9', author: 'National Bureau of Economic Research', title: 'Working paper on ChatGPT usage patterns (with OpenAI)', pub: 'cited in Part 2.' },\n        { n: '10', author: 'Semrush', title: 'Research on ChatGPT prompt length with/without web search', pub: 'cited in Part 2.' },\n        { n: '11', author: '[Author unknown]', title: 'Social post on Help Center documentation as a GEO surface', pub: 'unattributed; cited in Part 3.' },\n        { n: '12', author: 'Matt G. Southern', title: '\"AI Answers About Your Locations Are Often Wrong \\u2014 Check Before Customers Do\"', pub: 'Search Engine Journal, Jul 2026.' },\n        { n: '13', author: 'Roger Montti', title: '\"Google Explains SEO Connection Of Site Quality To Non-Indexed Pages\"', pub: 'Search Engine Journal, Jul 2026.' },\n        { n: '14', author: 'Louise Linehan (rev. Ryan Law)', title: '\"Retrieval Augmented Generation (RAG) Explained\"', pub: 'Ahrefs, Jul 9, 2026.' },\n        { n: '15', author: 'Despina Gavoyannis (rev. Ryan Law)', title: '\"What is Query Fan-Out?\"', pub: 'Ahrefs, Mar 2, 2026.' },\n        { n: '16', author: 'Google', title: '\"Google Marketing Live 2026\" recap (foreword, Vidhya Srinivasan)', pub: 'cited in Parts 1 and 6.' },\n        { n: '17', author: 'Similarweb', title: '\"The Downstream Impact of AI Visibility\" (Naspe, Reid, Sheridan, Tong, Mordecai; with Rand Fishkin)', pub: '2026.' },\n        { n: '18', author: 'Reviewly.ai', title: '\"The AI Recommendation Playbook\" (founder Jeff Schwerdt)', pub: 'concept only; cited in Part 4.' },\n        { n: '19', author: 'Internal Hecto documents', title: 'AI-Optimised Content Guidelines; Recovery Action Items; AI SEO Strategy That Lasts', pub: 'cited in Parts 2, 3, 8.' },\n        { n: '20', author: 'Adam Heitzman', title: '\"AI Overviews Now Answer Most Local Searches \\u2014 How To Get Your Business Cited\"', pub: 'Search Engine Journal, 2026.' },\n        { n: '21', author: 'Heitzman & Southern', title: '\"The New Google Business Profile Playbook for AI Local Search\"', pub: 'Search Engine Journal, 2026.' },\n        { n: '22', author: 'Jackson & Wortham', title: '\"Emergency Brand Audit\" webinar deck; \"Beyond the Stars 2025\" survey', pub: 'GatherUp, 2026.' },\n        { n: '23', author: 'Ben Moore', title: '\"Why most AEO tools give you noise (and what a real test bed looks like)\"', pub: 'Discovered Labs, 2026.' },\n        { n: '24', author: 'Matt G. Southern', title: '\"Google\\u2019s AI Search Data Is Growing, But The Gaps Remain\"', pub: 'Search Engine Journal, 2026.' },\n        { n: '25', author: '[Author unknown]', title: 'Ten sub-agent automation loops for site auditing and SEO maintenance', pub: 'unattributed; rewritten in Part 9.' },\n        { n: '26', author: 'Kevin Indig', title: '\"Where AI agents get stuck on your site\"', pub: 'via secondhand paraphrase; cited in Part 4.' },\n        { n: '27', author: '[Author unknown]', title: 'Screaming Frog context-priming workflow tip', pub: 'unattributed; rewritten in Part 9.' },\n        { n: '28', author: '[Author unknown, Nectiv Digital]', title: 'Fan-out query research update: ChatGPT and Gemini surfacing Reddit-specific searches', pub: 'unattributed; cited in Part 3.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
