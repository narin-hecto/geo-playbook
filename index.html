  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r: 60px solid rgba(254,105,1,.12);\"><\u002Fdiv>\n    <div style=\"position: absolute; bottom: -220px; right: 180px; width: 360px; height: 360px; border-radius: 50%; background: rgba(254,105,1,.08);\"><\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2;\">\n      <div style=\"display: flex; align-items: center; gap: 16px;\">\n        <img src=\"d6b7b805-45e9-4257-b438-f36c34159ff9\" alt=\"Hecto\" style=\"width: 46px; height: 46px; object-fit: contain;\">\n        <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; letter-spacing: .32em; font-size: 15px; color: #fff;\">HECTO MARKETING<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 13px; color: rgba(255,255,255,.55);\">FIELD PLAYBOOK · 2026<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .22em; font-size: 17px; color: #FE6901; margin-bottom: 26px;\">THE GEO PLAYBOOK<\u002Fdiv>\n      <h1 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 104px; line-height: .96; color: #fff; letter-spacing: -.02em; max-width: 1050px;\">What's changing in search — and what to do about it, in order.<\u002Fh1>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 24px; line-height: 1.5; color: rgba(255,255,255,.72); max-width: 720px; margin-top: 34px;\">A practical, step-by-step guide to optimizing for AI answer engines and traditional search at the same time — grouped in the order you'd actually execute it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 60px; position: relative; z-index: 2; border-top: 1px solid rgba(255,255,255,.14); padding-top: 30px;\">\n      <div><div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 40px; color: #FE6901;\">7<\u002Fdiv><div style=\"font-family: 'Quicksand', sans-serif; font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">PARTS<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 40px; color: #FE6901;\">9<\u002Fdiv><div style=\"font-family: 'Quicksand', sans-serif; font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">KEY TAKEAWAYS<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 40px; color: #FE6901;\">1<\u002Fdiv><div style=\"font-family: 'Quicksand', sans-serif; font-size: 13px; letter-spacing: .12em; color: rgba(255,255,255,.6); margin-top: 4px;\">FILL-IN CHECKLIST<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CONTENTS ============ -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px; position: relative;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #22314D; padding-bottom: 18px; margin-bottom: 46px;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; letter-spacing: .22em; font-size: 14px; color: #22314D;\">CONTENTS &amp; HOW TO USE THIS<\u002Fdiv>\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .18em; font-size: 12px; color: #FE6901;\">HECTO MARKETING<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.15fr 1fr; gap: 70px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n        <sc-for list=\"{{ toc }}\" as=\"row\" hint-placeholder-count=\"9\">\n          <div style=\"display: flex; align-items: baseline; gap: 22px; padding: 15px 0; border-bottom: 1px solid #E4DFD4;\">\n            <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 20px; color: #FE6901; min-width: 34px;\">{{ row.num }}<\u002Fspan>\n            <div style=\"flex: 1;\">\n              <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 20px; color: #22314D;\">{{ row.title }}<\u002Fdiv>\n              <div style=\"font-family: 'Quicksand', sans-serif; font-size: 15px; color: #6A7284; margin-top: 2px;\">{{ row.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 44px 42px; align-self: start;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; letter-spacing: .18em; font-size: 13px; color: #FE6901; margin-bottom: 20px;\">READ IT IN ORDER<\u002Fdiv>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82); margin-bottom: 18px;\">Search is splitting into two systems: traditional results and AI answer engines. This playbook covers both, and the sequence matters.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82); margin-bottom: 18px;\">Start with <strong style=\"color:#fff;\">research<\u002Fstrong> so every later step targets the right thing. Then work outward: your own pages, the wider web, PR, and how you measure it.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.62; color: rgba(255,255,255,.82);\">The <strong style=\"color:#fff;\">Adaptable Checklist<\u002Fstrong> is the whole book stripped to action — fill it in for one business and hand it off.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ KEY TAKEAWAYS ============ -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px;\">\n      <div>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">THE BOOK IN NINE POINTS<\u002Fdiv>\n        <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">Key Takeaways<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 20px; color: #E4DFD4;\">01<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ takeaways }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 30px 30px 32px; display: flex; flex-direction: column;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n            <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 26px; color: #FE6901;\">{{ t.num }}<\u002Fspan>\n            <span style=\"height: 1px; flex: 1; background: #EBE6DB;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #22314D; margin-bottom: 12px;\">{{ t.head }}<\u002Fh3>\n          <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.55; color: #545C6E;\">{{ t.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ADAPTABLE CHECKLIST ============ -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;\">\n      <div>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">FILL-IN VERSION OF EVERY ACTION ITEM<\u002Fdiv>\n        <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">The Adaptable Checklist<\u002Fh2>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ resetChecklist }}\" style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .06em; color: #22314D; background: transparent; border: 1px solid #C9C2B4; border-radius: 40px; padding: 10px 20px; cursor: pointer; margin-top: 8px;\" style-hover=\"border-color: #FE6901; color: #FE6901;\">Reset checklist<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.55; color: #545C6E; max-width: 820px; margin-bottom: 12px;\">Grouped in the order you'd execute it. Check items off and fill in the blanks for one specific business — your entries save automatically in this browser.<\u002Fp>\n    <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 40px;\">\n      <div style=\"flex: 1; height: 8px; background: #E7E2D7; border-radius: 6px; overflow: hidden;\"><div style=\"height: 100%; background: #FE6901; border-radius: 6px; width: {{ progressPct }}; transition: width .25s ease;\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; color: #22314D; min-width: 116px; text-align: right;\">{{ progressLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px;\">\n      <sc-for list=\"{{ checklist }}\" as=\"group\" hint-placeholder-count=\"5\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 30px; break-inside: avoid;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n            <span style=\"width: 8px; height: 22px; background: #FE6901; border-radius: 2px;\"><\u002Fspan>\n            <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 19px; color: #22314D; letter-spacing: .01em;\">{{ group.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 13px; align-items: flex-start;\">\n                <input type=\"checkbox\" checked=\"{{ item.checked }}\" data-id=\"{{ item.id }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width: 19px; height: 19px; margin-top: 3px; accent-color: #FE6901; flex-shrink: 0; cursor: pointer;\">\n                <div style=\"flex: 1;\">\n                  <label style=\"{{ item.textStyle }}\">{{ item.text }}<\u002Flabel>\n                  <input type=\"text\" placeholder=\"{{ item.hint }}\" value=\"{{ item.notes }}\" data-id=\"{{ item.id }}\" sc-camel-on-change=\"{{ onNote }}\" sc-camel-on-input=\"{{ onNote }}\" style=\"margin-top: 7px; width: 100%; font-family: 'Quicksand', sans-serif; font-size: 14px; color: #22314D; background: #FAF8F3; border: none; border-bottom: 1.5px solid #E0DACC; padding: 5px 4px; outline: none;\" style-focus=\"border-color: #FE6901;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 1 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">1<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART ONE<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">The Shift<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 640px;\">What's actually changing, and why it matters.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 1 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 34px; color: #22314D; line-height: 1.08; margin-bottom: 22px; letter-spacing: -.01em;\">Search is splitting into two systems<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.66; color: #3E4658; margin-bottom: 18px;\">For 25 years search worked one way: type a query, get ten blue links, click one. <strong>Alex Moss<\u002Fstrong> (Search Engine Journal, May 2025) marks the last 12 months as the point that model stopped being the default. AI Overviews, AI Mode, and assistant-style products now sit between a query and a click — often answering the question before a user sees a link.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.66; color: #3E4658; margin-bottom: 18px;\">Moss frames this as a move from <em>answer engines<\u002Fem> to <em>assistant engines<\u002Fem>. An answer engine gives you a fact. An assistant engine holds a conversation, remembers context, and decides what to show based on that accumulated context — a fundamentally different retrieval flow than SEO was built for.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.66; color: #3E4658;\">Her point isn't that organic SEO is dead. It's that click-through rate — the metric SEO has leaned on for two decades — now measures a shrinking share of what actually happens when someone searches.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 4px;\">The old scoreboard doesn't measure the new game<\u002Fdiv>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 15px; color: #6A7284; margin-bottom: 18px;\">Moss's comparison of what used to count vs. what counts now.<\u002Fdiv>\n        <div style=\"border: 1px solid #E4DFD4; border-radius: 5px; overflow: hidden;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; background: #22314D;\">\n            <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: rgba(255,255,255,.6); padding: 12px 18px;\">USED TO MATTER<\u002Fdiv>\n            <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #FE6901; padding: 12px 18px;\">NOW MATTERS MORE<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ scoreboard }}\" as=\"r\" hint-placeholder-count=\"9\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; background: {{ r.bg }};\">\n              <div style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; color: #6A7284; padding: 11px 18px;\">{{ r.old }}<\u002Fdiv>\n              <div style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; font-weight: 500; color: #22314D; padding: 11px 18px;\">{{ r.new }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15px; line-height: 1.55; color: #545C6E; margin-top: 16px;\">Two things stand out: E-E-A-T got <em>more<\u002Fem> important, not less — and almost every other item on the right is harder to measure with the tools most teams already have. That gap is why measurement gets its own part.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 20px; margin-top: 44px; background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 34px 40px; align-items: center;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 76px; color: #FE6901; line-height: .9;\">94%<\u002Fdiv>\n      <div style=\"width: 1px; height: 74px; background: #FBD9BE;\"><\u002Fdiv>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 19px; line-height: 1.55; color: #22314D; max-width: 900px;\">of enterprise organizations plan to <strong>increase AEO/GEO investment in 2026<\u002Fstrong> — now their top marketing priority, above paid media and paid search. Scaling AI-generated content was the most common strategy <em>and<\u002Fem> the most common challenge. <span style=\"color:#6A7284;\">(Conductor 2026 State of AEO/GEO CMO Investment Report, 250+ executives, via Shelley Walsh, SEJ.)<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 2 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">2<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART TWO<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Research &amp; Audit<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">Know what you're optimizing for before you touch anything.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 2 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 20px; line-height: 1.6; color: #3E4658; max-width: 1000px; margin-bottom: 40px;\">Everything in Parts 3–5 works better, and costs less, if it starts from real evidence of what your customers actually ask AI tools and where your brand already stands. This comes first because it should happen first.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 44px 60px;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 26px; color: #22314D; margin-bottom: 18px;\">Run a baseline audit before changing anything<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ baseline }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 16px;\">\n              <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 20px; color: #FE6901; min-width: 26px;\">{{ b.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: #22314D; margin-bottom: 3px;\">{{ b.q }}<\u002Fdiv>\n                <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.5; color: #545C6E;\">{{ b.a }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 26px; color: #22314D; margin-bottom: 18px;\">Find what customers actually ask AI<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.6; color: #3E4658; margin-bottom: 14px;\">Don't guess the questions. Three rules keep prompt research honest: keep prompts <strong>brand-neutral<\u002Fstrong> (no company names), avoid direct \"X vs. Y\" comparisons, and focus on <strong>mid-to-bottom funnel<\u002Fstrong> questions from people already evaluating options.<\u002Fp>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .1em; color: #22314D; margin: 20px 0 12px;\">WHERE TO FIND THEM<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n          <sc-for list=\"{{ sources2 }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; gap: 12px; align-items: baseline; padding-bottom: 9px; border-bottom: 1px solid #E4DFD4;\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #FE6901; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n              <span style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.45; color: #3E4658;\"><strong style=\"color:#22314D;\">{{ s.name }}<\u002Fstrong> — {{ s.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 38px; background: #22314D; border-radius: 5px; padding: 32px 40px;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 8px;\">GSC QUERY FILTER — ISOLATE REAL QUESTIONS<\u002Fdiv>\n      <code style=\"font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14.5px; line-height: 1.5; color: #A9D8FF; word-break: break-word; display: block;\">^(how|who|what|where|when|why|which|can|could|do|does|did|is|are|was|were|should|would|will|may|might)\\b<\u002Fcode>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15px; color: rgba(255,255,255,.66); margin-top: 12px;\">Paste into Search Console's query filter to surface question-based phrasing — close cousins of what the same person types into an AI tool.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 30px;\">\n      <sc-for list=\"{{ promptStats }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 24px 24px 26px;\">\n          <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 40px; color: #FE6901; line-height: 1;\">{{ p.stat }}<\u002Fdiv>\n          <p style=\"font-family: 'Quicksand', sans-serif; font-size: 14.5px; line-height: 1.42; color: #545C6E; margin-top: 10px;\">{{ p.label }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 15px; color: #6A7284; margin-top: 14px;\">Real prompts (vs. keyword-estimated ones) skew longer, more personal, and problem-first — a strategy built only on estimated prompts overweights \"best of\" comparison content.<\u002Fp>\n    <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 26px; color: #22314D; margin: 44px 0 6px;\">Think in two lenses<\u002Fh3>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.55; color: #545C6E; max-width: 1000px; margin-bottom: 18px;\">A prompt that would be answered by naming a company belongs in the first bucket; one answered by describing a product quality belongs in the second. Mixing the two produces a confused research set.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n      <sc-for list=\"{{ lenses }}\" as=\"l\" hint-placeholder-count=\"2\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 26px 30px;\">\n          <h4 style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 18px; color: #22314D; margin-bottom: 10px;\">{{ l.title }}<\u002Fh4>\n          <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; line-height: 1.5; color: #4A5265;\">{{ l.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; background: #22314D; border-radius: 5px; overflow: hidden;\">\n      <div style=\"padding: 28px 34px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #6FE0A0; margin-bottom: 15px;\">KEEP A PROMPT IF IT…<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ qualityKeep }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 11px; align-items: baseline;\"><span style=\"color: #6FE0A0; font-weight: 700; font-family: 'Quicksand', sans-serif;\">✓<\u002Fspan><span style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; line-height: 1.4; color: rgba(255,255,255,.82);\">{{ q }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 28px 34px; border-left: 1px solid rgba(255,255,255,.12);\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 15px;\">CUT IT IF IT…<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ qualityCut }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 11px; align-items: baseline;\"><span style=\"color: #FE6901; font-weight: 700; font-family: 'Quicksand', sans-serif;\">×<\u002Fspan><span style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; line-height: 1.4; color: rgba(255,255,255,.82);\">{{ q }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 20px; background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 24px 32px;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #FE6901; margin-bottom: 8px;\">TWO NAMED, CHECKABLE SOURCES<\u002Fdiv>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.55; color: #3E4658;\"><strong>NBER<\u002Fstrong> (with OpenAI usage data): practical guidance and information-seeking are among the most common ChatGPT use cases, out of a reported ~2 billion searches run on the platform daily. <strong>Semrush:<\u002Fstrong> prompts averaged 4.2 words with web search active vs. 23 words without — some without web search ran over 2,700 words.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 3 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">3<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART THREE<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">On-Page<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What to fix on your own site, and in what order.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 3 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 46px;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 30px; color: #22314D; line-height: 1.1; margin-bottom: 20px;\">How AI systems actually read a page<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>Carolyn Shelby<\u002Fstrong> (SEJ, April 2025): structured <em>data<\u002Fem> (schema, JSON-LD) is optional for LLMs. Structured <em>writing<\u002Fem> is not. Crawlers rely on markup and links; LLMs tokenize the page and use attention to judge whether it expresses a clear idea and answers a question directly.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658;\">A keyword-rich page with full schema can still fail to appear in an AI summary, while a clear, well-formatted post with zero structured data gets quoted. Schema reinforces good structure — it doesn't rescue bad structure. And retrieval still depends on <strong>literal phrasing<\u002Fstrong>: write the words your customers actually type.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 34px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .1em; color: #FE6901; margin-bottom: 18px;\">FIVE STRUCTURAL PATTERNS AI FAVORS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ patterns }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n              <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 15px; color: #fff; background: #22314D; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ p.n }}<\u002Fspan>\n              <span style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.45; color: #3E4658;\">{{ p.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 24px; color: #22314D; margin-bottom: 6px;\">The how-to, grouped by cadence<\u002Fdiv>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; color: #545C6E; margin-bottom: 22px;\">Restated in our own words from the on-page checklist, and consistent with Shelby's research above.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ onpageTopics }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 30px 30px 32px;\">\n          <h4 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 21px; color: #22314D; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid #F0EBE0;\">{{ c.title }}<\u002Fh4>\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <sc-for list=\"{{ c.groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"display: inline-block; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .1em; color: #FE6901; background: #FFF3EA; border: 1px solid #FBD9BE; padding: 4px 11px; border-radius: 30px; margin-bottom: 12px;\">{{ g.tag }}<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                      <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #22314D; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n                      <span style=\"font-family: 'Quicksand', sans-serif; font-size: 14.5px; line-height: 1.42; color: #4A5265;\">{{ i }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; margin-top: 44px; align-items: start;\">\n      <div style=\"background: #22314D; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 16px;\">AUTHOR IDENTITY<\u002Fdiv>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.55; color: rgba(255,255,255,.8); margin-bottom: 16px;\">Roger Montti (SEJ, July 2026) relayed John Mueller on two invented fixes — an \"llms-author.txt\" file and a \"Content-Signal\" header:<\u002Fp>\n        <blockquote style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 18px; line-height: 1.5; color: #fff; border-left: 3px solid #FE6901; padding-left: 18px; margin-bottom: 16px;\">\"Google doesn't use llms.txt or llms-author.txt… it has no effects whatsoever for any crawler or llm.\"<\u002Fblockquote>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.55; color: rgba(255,255,255,.8);\">The real fix for a name-collision problem isn't a made-up file — it's real Author schema, a linked bio page, and a body of attributable work.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 34px 38px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 6px;\">CONTENT ARCHITECTURE FOR SCALE &amp; PERSONALIZATION<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 12px;\">\n          <sc-for list=\"{{ arch }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid #EBE6DB; padding-bottom: 14px;\">\n              <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; color: #22314D; margin-bottom: 3px;\">{{ a.name }}<\u002Fdiv>\n              <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15px; line-height: 1.48; color: #545C6E;\">{{ a.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 44px; border-left: 4px solid #FE6901; background: #fff; border-radius: 0 5px 5px 0; padding: 30px 36px;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 22px; color: #22314D; margin-bottom: 12px;\">⚠&nbsp; The scaling trap<\u002Fdiv>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 17.5px; line-height: 1.6; color: #3E4658; margin-bottom: 10px;\">Scaling AI-generated content is the most common strategy <em>and<\u002Fem> the most common failure. Google began issuing <strong>manual actions for scaled content abuse<\u002Fstrong> in June 2025 (Pedro Dias), and its Quality Rater Guidelines now apply the lowest rating to low-effort AI content regardless of how it was produced (John Mueller). The \"Mt. AI effect\": a freshness spike, then a cliff when quality assessment catches up (Glenn Gabe / Dan Taylor).<\u002Fp>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 17.5px; line-height: 1.6; color: #3E4658;\"><strong>The fix:<\u002Fstrong> wrap AI tools around subject-matter experts and editors rather than replacing them. Danny Sullivan's distinction — commodity content (anything an AI could produce from public info) vs. non-commodity content (requires real experience or an informed opinion) — is the actual competitive advantage going into the AI era.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 22px 0 18px;\">\n        <sc-for list=\"{{ scalingQuotes }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"background: #F7F5F1; border: 1px solid #EBE6DB; border-radius: 5px; padding: 18px 20px;\">\n            <p style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 14.5px; line-height: 1.45; color: #3E4658; margin-bottom: 8px;\">“{{ q.quote }}”<\u002Fp>\n            <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .04em; color: #FE6901;\">{{ q.who }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; line-height: 1.55; color: #545C6E;\"><strong style=\"color:#22314D;\">Enforcement is already here.<\u002Fstrong> Perplexity once confidently reported a \"September 2025 Perspective Core Algorithm Update\" that never happened, citing AI-generated agency blogs that had hallucinated it (Lily Ray's test). Google's spam policies now explicitly cover manipulating generative AI responses — including buying or altering citations (Matt G. Southern, June 2026).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 4 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">4<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART FOUR<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Off-Page<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What to fix beyond your own site.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 4 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">Entity consistency is the foundation<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\">If a business's name, address, or description varies even slightly across Google Business Profile, Apple Maps, Yelp, and Bing Places, AI systems can treat one business as several unrelated ones. Montserrat Cano calls this <strong>\"entity drift.\"<\u002Fstrong> Auditing every listing against one agreed-on version is the single highest-leverage fix for a multi-location business.<\u002Fp>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 28px; color: #22314D; margin: 30px 0 16px;\">Being mentioned &gt; being linked<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658;\"><strong>Mordy Oberstein:<\u002Fstrong> LLMs synthesize the whole web into one answer, so <em>how<\u002Fem> a brand is talked about — where, by whom, how often — carries more weight than whether one specific page gets cited. Your outreach target list comes straight from Part 2: sites that cite competitors but not you.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 40px 42px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 20px;\">WHERE OFF-PAGE AUTHORITY LIVES<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <sc-for list=\"{{ offpage }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 18px;\">\n              <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: #fff; margin-bottom: 4px;\">{{ o.name }}<\u002Fdiv>\n              <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15.5px; line-height: 1.45; color: rgba(255,255,255,.68);\">{{ o.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 24px; color: #22314D; margin: 48px 0 6px;\">Off-page authority checklist<\u002Fdiv>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; color: #545C6E; margin-bottom: 22px;\">These tasks live outside your own site even though the fix is often implemented on it.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ offpageCadence }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 30px;\">\n          <div style=\"display: inline-block; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .1em; color: #FE6901; background: #FFF3EA; border: 1px solid #FBD9BE; padding: 4px 11px; border-radius: 30px; margin-bottom: 14px;\">{{ g.tag }}<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n            <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #22314D; flex-shrink: 0; transform: translateY(-2px);\"><\u002Fspan>\n                <span style=\"font-family: 'Quicksand', sans-serif; font-size: 14.5px; line-height: 1.42; color: #4A5265;\">{{ i }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 5 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">5<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART FIVE<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">PR &amp; Brand Authority<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">Shaping what AI systems say about you.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 5 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 20px; line-height: 1.6; color: #3E4658; max-width: 1000px; margin-bottom: 40px;\">Parts 3 and 4 fix what's <em>true<\u002Fem>. This part makes sure AI systems — and the people reading their answers — understand it correctly.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <sc-for list=\"{{ prCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 32px 30px; display: flex; flex-direction: column;\">\n          <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 30px; color: #FE6901; margin-bottom: 14px;\">{{ c.n }}<\u002Fdiv>\n          <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 21px; color: #22314D; line-height: 1.18; margin-bottom: 12px;\">{{ c.title }}<\u002Fh3>\n          <p style=\"font-family: 'Quicksand', sans-serif; font-size: 16.5px; line-height: 1.55; color: #4A5265;\">{{ c.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top: 34px; background: #FFF3EA; border: 1px solid #FBD9BE; border-radius: 5px; padding: 30px 40px;\">\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18.5px; line-height: 1.55; color: #22314D;\"><strong>The thread through everything:<\u002Fstrong> the only way to influence what an LLM says is a clear, consistently reinforced brand identity. Start with one checkable answer to <em>\"what do you want people to say about your brand?\"<\u002Fem> — then reinforce it in every page, every outreach effort, and every placement.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 6 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">6<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART SIX<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Measurement<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 700px;\">What actually tells you it's working.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 6 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; margin-bottom: 44px;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">The old dashboard is going dark<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\">Mentions, share of voice, and citations don't live in the tools most teams have open daily. Alex Moss calls attribution \"a mess\" — even Google says it has no plans to add AI Overview insight data to Search Console. In the SC generative report, an impression only counts when a collapsed \"show more\" link is actually opened, and there's no click data at all (John Mueller).<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658;\"><strong>The working proxy:<\u002Fstrong> branded search volume tracked over time. Similarweb found <strong>55.9%<\u002Fstrong> of downstream traffic after a ChatGPT recommendation arrived via branded search, not a direct click. As Aleyda Solís puts it, \"AI influence can happen without a click.\"<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .1em; color: #FE6901; margin-bottom: 16px;\">THE MONITORING CADENCE<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ cadence }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 16px; align-items: center; background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 14px 20px;\">\n              <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .08em; color: #fff; background: #FE6901; padding: 5px 11px; border-radius: 30px; min-width: 88px; text-align: center;\">{{ c.when }}<\u002Fspan>\n              <span style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.4; color: #3E4658;\">{{ c.what }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #fff; border: 1px solid #E9E4D9; border-radius: 5px; padding: 28px 36px;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 10px;\">THE DATA POINTS SOMEWHERE UNEXPECTED<\u002Fdiv>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 17px; line-height: 1.6; color: #3E4658;\"><strong>Advanced Web Ranking (Q1 2026):<\u002Fstrong> desktop and mobile CTR moved in opposite directions — mobile's top-position CTR dropped ~2.2 points, while desktop gains showed up mostly below position three. Don't average them; a quarter of desktop gains doesn't offset months of mobile softness. Track them separately, and pair the numbers with branded search volume as your working AI-awareness proxy.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART DIVIDER 7 ============ -->\n  <section style=\"width: 1380px; min-height: 340px; background: #22314D; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 64px 90px; display: flex; align-items: center; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-family: 'Quicksand', sans-serif; font-weight: 900; font-size: 220px; color: rgba(254,105,1,.14); line-height: 1;\">7<\u002Fdiv>\n    <div style=\"position: relative; z-index: 2;\">\n      <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .24em; font-size: 15px; color: #FE6901; margin-bottom: 16px;\">PART SEVEN<\u002Fdiv>\n      <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 62px; color: #fff; letter-spacing: -.02em;\">Governance<\u002Fh2>\n      <p style=\"font-family: 'Quicksand', sans-serif; font-size: 21px; color: rgba(255,255,255,.72); margin-top: 14px; max-width: 720px;\">The AI-crawler decision sitting underneath all of it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 7 CONTENT -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: start;\">\n      <div>\n        <h3 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 28px; color: #22314D; margin-bottom: 16px;\">The deal that built the web is breaking<\u002Fh3>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658; margin-bottom: 16px;\"><strong>Matthew Prince<\u002Fstrong> (Cloudflare, July 2025) frames the economic shift: the old bargain let Google index a site in exchange for traffic the site could monetize. The interface changed. He cites research that ~75% of mobile Google queries are now answered without leaving Google.<\u002Fp>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-size: 18px; line-height: 1.64; color: #3E4658;\">Cloudflare's response, launched July 1, 2025 as \"Content Independence Day\": default to blocking AI crawlers unless the AI company compensates the creator. His longer-term vision is a marketplace where content is valued not by the traffic it generates but by how much genuinely new information it contributes. Whether AI crawlers can reach a business's content at all is now <strong>a decision, not a default<\u002Fstrong> — and it deserves the same quarterly review as any other technical item.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #22314D; border-radius: 5px; padding: 38px 40px;\">\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .12em; color: #FE6901; margin-bottom: 18px;\">HARDER TO EARN A CLICK THAN A DECADE AGO<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ multipliers }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; align-items: baseline; gap: 16px;\">\n              <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 34px; color: #FE6901; min-width: 130px;\">{{ m.x }}<\u002Fspan>\n              <span style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; color: rgba(255,255,255,.78);\">{{ m.who }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 13.5px; color: rgba(255,255,255,.5); margin-top: 20px;\">Prince's own estimates, stated as his claim rather than an independently verified figure.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SOURCES ============ -->\n  <section style=\"width: 1380px; background: #F7F5F1; border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.28); padding: 76px 90px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px;\">\n      <div>\n        <div style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .2em; font-size: 14px; color: #FE6901; margin-bottom: 12px;\">APPENDIX<\u002Fdiv>\n        <h2 style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 52px; color: #22314D; letter-spacing: -.02em;\">Sources<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px 40px;\">\n      <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"10\">\n        <div style=\"display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E4DFD4; align-items: baseline;\">\n          <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 15px; color: #FE6901; min-width: 26px;\">{{ s.n }}<\u002Fspan>\n          <div>\n            <span style=\"font-family: 'Quicksand', sans-serif; font-size: 16px; line-height: 1.45; color: #22314D;\"><strong>{{ s.author }}<\u002Fstrong> — {{ s.title }}<\u002Fspan>\n            <span style=\"font-family: 'Quicksand', sans-serif; font-style: italic; font-size: 14.5px; color: #6A7284;\"> {{ s.pub }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-family: 'Quicksand', sans-serif; font-size: 15px; line-height: 1.55; color: #6A7284; margin-top: 24px; max-width: 1100px;\">Additional individuals quoted at first mention in the body: Aleyda Solís, Eli Schwartz, Lily Ray, Pedro Dias, Dan Taylor, Glenn Gabe, Danny Sullivan, John Mueller, Shushrita M., Nicola Agius, and the Doostmohammadi et al. (2023) paper. National Bureau of Economic Research (with OpenAI) and Semrush prompt-length research cited in Part 2.<\u002Fp>\n    <div style=\"margin-top: 40px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid #22314D; padding-top: 24px;\">\n      <div style=\"display: flex; align-items: center; gap: 14px;\">\n        <div style=\"width: 40px; height: 40px; border-radius: 8px; background: #22314D; display: flex; align-items: center; justify-content: center;\"><img src=\"d6b7b805-45e9-4257-b438-f36c34159ff9\" alt=\"Hecto\" style=\"width: 26px; height: 26px; object-fit: contain;\"><\u002Fdiv>\n        <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 700; letter-spacing: .22em; font-size: 13px; color: #22314D;\">HECTO MARKETING<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-family: 'Quicksand', sans-serif; font-weight: 600; letter-spacing: .16em; font-size: 12px; color: #9AA0AC;\">THE GEO PLAYBOOK · 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('geo_playbook_checklist') || '{}'); } catch (e) {}\n    this.state = { data: saved };\n    this._defs = this.checklistDefs();\n  }\n\n  checklistDefs() {\n    return [\n      { title: 'Research & Audit (do this first)', items: [\n        { id: 'r1', text: 'Baseline check: ask 3\\u20135 named AI platforms who the leading providers are in your category; document who gets named.', hint: 'Platforms + category\\u2026' },\n        { id: 'r2', text: 'Identify third-party sites that mention your top competitors but not you; note as outreach targets.', hint: 'Competitors\\u2026' },\n        { id: 'r3', text: 'Pull the last 90 days of GSC queries; filter for question-based phrasing to find real customer language.', hint: 'Date range / owner\\u2026' },\n        { id: 'r4', text: 'Build a working prompt list customers would type before choosing a provider. Rank by priority.', hint: 'Owner / target count\\u2026' },\n        { id: 'r5', text: 'Run a short 3\\u20135 question customer survey on what they typed when they started looking.', hint: 'Owner\\u2026' } ] },\n      { title: 'On-Page (fix your own site next)', items: [\n        { id: 'o1', text: 'Top pages reviewed for a direct answer in the first 1\\u20132 sentences of each section.', hint: 'How many pages\\u2026' },\n        { id: 'o2', text: 'TL;DR / key-takeaways block added; question-based headings mirroring real searches.', hint: 'Owner\\u2026' },\n        { id: 'o3', text: 'JSON-LD schema across all templates; Organization schema on every page with matching NAP.', hint: 'Templates / # locations\\u2026' },\n        { id: 'o4', text: 'Author schema + linked bio page for every named contributor.', hint: 'Contributor names\\u2026' },\n        { id: 'o5', text: 'Recent content flagged for a recency refresh.', hint: 'Window / owner\\u2026' } ] },\n      { title: 'Crawlability & Governance', items: [\n        { id: 'c1', text: 'Written AI bot allow/block policy: OpenAI (GPTBot), Google-Extended, Anthropic (ClaudeBot), PerplexityBot, CCBot.', hint: 'Documented on (date)\\u2026' },\n        { id: 'c2', text: 'robots.txt updated to name each bot explicitly.', hint: 'Last reviewed (date)\\u2026' },\n        { id: 'c3', text: 'Reassess the allow/block policy and robots.txt against the current bot landscape.', hint: 'Owner / quarterly\\u2026' } ] },\n      { title: 'Off-Page (beyond your site)', items: [\n        { id: 'f1', text: 'NAP data confirmed identical across Google Business Profile, Apple Maps, Yelp, Bing Places, + others.', hint: 'Other directories\\u2026' },\n        { id: 'f2', text: 'List built of third-party sites, forums, and communities where your category gets discussed.', hint: 'Reddit / forums / review sites\\u2026' },\n        { id: 'f3', text: 'Outbound link quality audit: 2\\u20133 authoritative external sources cited per longform piece.', hint: 'Owner\\u2026' },\n        { id: 'f4', text: 'Brand sentiment audit across third-party sites.', hint: 'Owner / cadence\\u2026' } ] },\n      { title: 'PR & Brand Authority', items: [\n        { id: 'p1', text: 'Sentiment + mention audit: ask the AI platforms what they say about you and competitors; log hedging, gaps, errors.', hint: 'Platforms\\u2026' },\n        { id: 'p2', text: 'One-sentence brand identity statement all teams point to.', hint: 'We are the provider known for\\u2026' },\n        { id: 'p3', text: 'Named contributors prioritized for bylines / interviews based on who already gets cited.', hint: 'Names\\u2026' } ] },\n      { title: 'Monitoring (owner + cadence)', items: [\n        { id: 'm1', text: 'Daily \\u2014 check citations, mentions, sentiment, and crawl frequency for unusual patterns.', hint: 'Owner\\u2026' },\n        { id: 'm2', text: 'Weekly \\u2014 track share-of-voice and AI Overview / AI Mode ownership for priority prompts.', hint: 'Owner\\u2026' },\n        { id: 'm3', text: 'Monthly \\u2014 analyze bot crawl activity in logs; benchmark AI visibility vs. competitors; circulate report.', hint: 'Owner\\u2026' },\n        { id: 'm4', text: 'Quarterly \\u2014 review change log vs. performance shifts; re-run the full baseline audit.', hint: 'Owner\\u2026' } ] } ];\n  }\n\n  save(data) {\n    try { localStorage.setItem('geo_playbook_checklist', JSON.stringify(data)); } catch (e) {}\n  }\n\n  onToggle = (e) => {\n    const id = e.target.dataset.id;\n    const data = { ...this.state.data, [id]: { ...(this.state.data[id] || {}), checked: e.target.checked } };\n    this.save(data); this.setState({ data });\n  };\n\n  onNote = (e) => {\n    const id = e.target.dataset.id;\n    const data = { ...this.state.data, [id]: { ...(this.state.data[id] || {}), notes: e.target.value } };\n    this.save(data); this.setState({ data });\n  };\n\n  resetChecklist = () => {\n    this.save({}); this.setState({ data: {} });\n  };\n\n  renderVals() {\n    const d = this.state.data || {};\n    const checklist = this._defs.map(g => ({\n      title: g.title,\n      items: g.items.map(it => {\n        const s = d[it.id] || {};\n        return { id: it.id, text: it.text, hint: it.hint, checked: !!s.checked, notes: s.notes || '',\n          textStyle: { fontFamily: \"'Quicksand', sans-serif\", fontSize: '15.5px', lineHeight: '1.42',\n            color: s.checked ? '#9AA0AC' : '#3E4658', textDecoration: s.checked ? 'line-through' : 'none',\n            display: 'block' } };\n      })\n    }));\n    const total = this._defs.reduce((a, g) => a + g.items.length, 0);\n    const done = Object.values(d).filter(v => v && v.checked).length;\n    const pct = total ? Math.round((done / total) * 100) : 0;\n\n    return {\n      checklist,\n      onToggle: this.onToggle, onNote: this.onNote, resetChecklist: this.resetChecklist,\n      progressPct: pct + '%',\n      progressLabel: done + ' / ' + total + ' done',\n      toc: [\n        { num: '\\u2014', title: 'Key Takeaways', desc: 'The book in nine points' },\n        { num: '\\u2713', title: 'The Adaptable Checklist', desc: 'Fill-in version of every action item' },\n        { num: '1', title: 'The Shift', desc: \"What's changing and why it matters\" },\n        { num: '2', title: 'Research & Audit', desc: 'Know what you\\u2019re optimizing for first' },\n        { num: '3', title: 'On-Page', desc: 'Fix your own site, in order' },\n        { num: '4', title: 'Off-Page', desc: 'Fix what\\u2019s beyond your site' },\n        { num: '5', title: 'PR & Brand Authority', desc: 'Shape what AI says about you' },\n        { num: '6', title: 'Measurement', desc: 'What tells you it\\u2019s working' },\n        { num: '7', title: 'Governance', desc: 'The AI-crawler decision underneath it all' }\n      ],\n      takeaways: [\n        { num: '01', head: 'Search is splitting into two systems', body: 'Traditional results and AI answer engines now sit side by side. Rankings and CTR measure a shrinking share of how people find a business \\u2014 and 94% of enterprises plan to increase AEO/GEO spend in 2026 (Conductor, via Shelley Walsh).' },\n        { num: '02', head: 'Research comes before optimization', body: 'Knowing the exact phrases customers type into ChatGPT, Copilot, and Google AI Mode \\u2014 not what you assume \\u2014 is what makes every later step target the right thing.' },\n        { num: '03', head: \"AI doesn't read a page like a crawler\", body: 'LLMs tokenize content and evaluate semantic clarity, not markup. Clear headings, one idea per paragraph, and an answer in the first sentence matter more than schema (Carolyn Shelby).' },\n        { num: '04', head: 'Scaling AI content is the top strategy \\u2014 and top failure', body: 'Google has issued manual actions for scaled AI content abuse (Pedro Dias) and downgrades low-effort AI content regardless of how it was produced (John Mueller).' },\n        { num: '05', head: 'Entity consistency is the off-page foundation', body: 'The same name, address, phone, and description everywhere is what keeps AI from treating one business as several. The single highest-leverage fix for multi-location brands.' },\n        { num: '06', head: 'Being mentioned beats being linked', body: 'LLMs synthesize the entire web into one answer, so how a brand is talked about across sites you don\\u2019t own carries more weight than one cited page (Mordy Oberstein).' },\n        { num: '07', head: 'The old dashboard is going dark', body: 'Clicks and rankings don\\u2019t capture AI visibility, and platforms don\\u2019t expose referral data. Branded search volume and share-of-voice are the closest working substitutes (Aleyda Sol\\u00eds).' },\n        { num: '08', head: 'Personalization needs the right architecture', body: 'Page-based CMS platforms force personalization into expensive one-off builds. Component-based content with a named owner and a review rhythm is what makes it sustainable (Gabriel Dillon).' },\n        { num: '09', head: 'AI-crawler access is now a decision', body: 'A growing number of publishers block AI crawlers unless compensated. That setting deserves the same quarterly review as any technical item (Matthew Prince, Cloudflare).' }\n      ],\n      scoreboard: [\n        { old: 'Content', new: 'Context + sentiment', bg: '#fff' },\n        { old: 'Keywords', new: 'Intent', bg: '#F5F2EC' },\n        { old: 'Brand', new: 'Brand + sentiment', bg: '#fff' },\n        { old: 'Rankings', new: 'Mentions', bg: '#F5F2EC' },\n        { old: 'Links from external sources', new: 'Citations across channels', bg: '#fff' },\n        { old: 'SERP monopoly', new: 'Share of voice', bg: '#F5F2EC' },\n        { old: 'E-E-A-T', new: 'Still E-E-A-T', bg: '#fff' },\n        { old: 'Structured data', new: 'Entities, knowledge graph, embeddings', bg: '#F5F2EC' },\n        { old: 'Answering', new: 'Assisting', bg: '#fff' }\n      ],\n      baseline: [\n        { n: '1', q: 'Where does the brand already show up?', a: 'Ask the AI platforms your customers use category questions; record which brands get named.' },\n        { n: '2', q: 'Who else is getting cited?', a: 'Find the third-party sites AI tools cite \\u2014 and which mention competitors but not you.' },\n        { n: '3', q: 'Which of your pages are citation-worthy?', a: 'Cross-reference organic-traffic pages against pages that appear in AI answers. A gap points to a structural fix.' },\n        { n: '4', q: 'Where do you stand vs. named competitors?', a: 'Benchmark against your top 1 and top 3 named competitors, not the category in general.' }\n      ],\n      sources2: [\n        { name: 'Google Search Console', desc: 'export top queries, filter for question phrasing' },\n        { name: 'AI Overviews + \"People Also Ask\"', desc: 'expand every question; ~40\\u201350 raw questions in 6\\u20138 searches' },\n        { name: 'Copilot & ChatGPT', desc: 'ask directly for common category questions \\u2014 validate, don\\u2019t finalize' },\n        { name: 'Customer surveys', desc: 'most underused, most authentic; 20\\u201330 responses \\u2192 10\\u201315 distinct prompts' },\n        { name: 'Sales team insight', desc: 'discovery calls, demos, RFPs \\u2014 the real buying language already in your CRM' },\n        { name: 'Reddit & industry forums', desc: 'blunt, unpolished phrasing in the same register as AI prompts' }\n      ],\n      promptStats: [\n        { stat: '71%', label: 'longer: real prompts averaged 15.1 words vs. 8.8 for estimated ones' },\n        { stat: '78.9%', label: 'of real prompts showed tool-finding intent (vs. 62.5%)' },\n        { stat: '52.1%', label: 'used personal pronouns \\u2014 \"I\", \"my\", \"me\" (vs. 18.8%)' },\n        { stat: '~3\\u00d7', label: 'more likely to be phrased as a problem to solve (21.1% vs. 7.1%)' }\n      ],\n      patterns: [\n        { n: '1', text: 'Clear headings with proper H1\\u2013H3 nesting.' },\n        { n: '2', text: 'Short, self-contained paragraphs \\u2014 one idea each.' },\n        { n: '3', text: 'Structured formats: lists for steps, tables for comparisons, FAQ for Q&A.' },\n        { n: '4', text: 'The key point stated at the top, not the bottom.' },\n        { n: '5', text: 'Semantic signposting: \"in summary\", \"the most important\", \"step 1\".' }\n      ],\n      onpageBlocks: [\n        { tag: 'CONTENT STRUCTURE', title: 'Every piece', items: ['Answer the primary question in the first 1\\u20132 sentences', 'Question-based headings from Part 2 research', 'Self-contained answers that make sense quoted alone', 'A summary block near the top; define jargon on first use', 'One original element per page \\u2014 data, quote, or POV'] },\n        { tag: 'CRAWLABILITY', title: 'Setup + ongoing', items: ['Explicit AI-bot allow/block policy in writing', 'robots.txt names major bots, not a wildcard', 'Topic-cluster architecture with pillar pages', 'Canonical tags on every indexable page', 'Link new content to/from its pillar; add to sitemap'] },\n        { tag: 'TECHNICAL HEALTH', title: 'Authority signals', items: ['JSON-LD across every template', 'Organization schema site-wide, consistent NAP', 'Person schema on author bios with sameAs links', 'Validate schema before publishing, not after', 'Confirm critical content loads in HTML, not client JS'] }\n      ],\n      offpage: [\n        { name: 'Community discussion', desc: 'Reddit threads and industry forums, where AI tools increasingly pull real, unpolished answers.' },\n        { name: 'Reference sources', desc: 'Wikipedia and category-standard reference sites, where a factual, well-sourced presence carries weight.' },\n        { name: 'Earned media & digital PR', desc: 'Getting named accurately in industry publications and local press.' },\n        { name: 'Content partnerships', desc: 'Contributing to or being referenced by sites that already rank and get cited in your category.' }\n      ],\n      prCards: [\n        { n: '01', title: 'Mentions are the goal, not citations'
